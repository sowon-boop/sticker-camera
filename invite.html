<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#FFC44D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<title>신소원 생일파티 초대 🎂</title>
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; padding:28px 18px; min-height:100dvh;
  font-family:"Gowun Dodum",system-ui,sans-serif; color:#5C4B3A;
  background:#FFC44D; display:grid; place-items:center; overflow-x:hidden;
}
.card{
  position:relative; width:100%; max-width:400px; background:#fff;
  border-radius:34px; padding:30px 26px 34px; text-align:center;
  box-shadow:0 22px 50px rgba(120,78,10,.22), 0 6px 16px rgba(120,78,10,.12);
}
.card::before{
  content:""; position:absolute; top:-11px; left:50%; transform:translateX(-50%) rotate(-1.5deg);
  width:104px; height:22px; border-radius:4px;
  background:repeating-linear-gradient(45deg,rgba(255,201,60,.55) 0 7px,rgba(255,159,182,.55) 7px 14px);
  box-shadow:0 3px 8px rgba(0,0,0,.06);
}
.deco{font-size:32px; letter-spacing:6px; margin:2px 0 6px;}
.tagline{
  width:fit-content; margin:0 auto 10px; padding:5px 15px; border-radius:999px;
  background:#FFF3F6; border:2px solid #FFD9E3;
  font-family:"Gaegu",sans-serif; font-weight:700; font-size:14px; color:#F2718E; letter-spacing:1px;
}
h1{font-family:"Jua",sans-serif; font-size:29px; margin:.1em 0 .1em; color:#4E3D2B; letter-spacing:-.6px;}
.sub{color:#8B7860; font-size:15px; margin:0 0 20px; line-height:1.8;}
.qrbox{
  background:#fff; border:3px solid #F5EBDA; border-radius:26px; padding:16px;
  width:fit-content; margin:0 auto; box-shadow:inset 0 0 0 6px rgba(255,201,60,.10);
}
.qrbox img{display:block; width:230px; height:230px; image-rendering:pixelated;}
.scan{
  font-family:"Jua",sans-serif; font-size:17px; color:#4E3D2B; margin:18px 0 4px;
}
.scan b{color:#F5A623;}
.url{
  font-family:"Gaegu",sans-serif; font-weight:700; font-size:13px; color:#B8A88F;
  word-break:break-all; margin-top:6px;
}
.foot{font-family:"Gaegu",sans-serif; font-weight:700; font-size:13px; color:#A5905F; margin-top:16px; letter-spacing:.5px;}
@media print{ body{background:#fff; padding:0;} .card{box-shadow:none;} }
</style>
</head>
<body>
  <div class="card">
    <div class="deco">🎂 ✨ 🎀</div>
    <div class="tagline">💛 우정 테스트 💛</div>
    <h1>신소원 생일파티</h1>
    <p class="sub">과연 나는 신소원에 대해<br>얼만큼 알고 있을까?</p>
    <div class="qrbox">
      <img src="stickers/quiz-qr.png" alt="퀴즈 입장 QR 코드">
    </div>
    <p class="scan">📷 카메라로 <b>QR 스캔</b>하면<br>바로 입장!</p>
    <p class="url">sowon-boop.github.io/sticker-camera/quiz.html</p>
    <p class="foot">🎂 신소원 우정 테스트 · 2026.08.02</p>
  </div>
</body>
</html>
