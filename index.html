<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>찰칵 · 스티커 카메라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --grape-1:#211A33;
    --grape-2:#14101F;
    --surface:#2E2542;
    --surface-2:#392E52;
    --pink:#FF5D9E;
    --mint:#57E6C3;
    --yellow:#FFD65C;
    --text:#EDE6FA;
    --muted:#9E93B8;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Gothic A1",system-ui,sans-serif;
    background:#ffffff;
    color:#211A33;
    display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---- header ---- */
  header{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px 10px;
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand h1{
    font-family:"Jua",sans-serif;font-weight:400;margin:0;font-size:26px;letter-spacing:.5px;
    background:linear-gradient(92deg,var(--pink),var(--yellow) 60%,var(--mint));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand small{color:var(--muted);font-size:12px;font-weight:600;}
  .top-btns{display:flex;gap:8px;}
  .icon-btn{
    width:42px;height:42px;border-radius:14px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-size:18px;cursor:pointer;
    display:grid;place-items:center;transition:transform .12s, background .12s;
  }
  .icon-btn:active{transform:scale(.9);}
  .icon-btn.on{background:linear-gradient(135deg,var(--pink),#c9448a);border-color:transparent;color:#fff;}

  /* ---- stage ---- */
  .stage-wrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:4px 14px;min-height:0;}
  .stage{
    position:relative;width:100%;max-width:520px;aspect-ratio:3/4;
    background:#000;border-radius:26px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
    max-height:100%;
  }
  #video,#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  .stage.mirror #video,.stage.mirror #photo{transform:scaleX(-1);}
  #layer{position:absolute;inset:0;overflow:hidden;}
  .sticker{
    position:absolute;touch-action:none;cursor:grab;will-change:transform;
    transform:translate(-50%,-50%) rotate(var(--rot,0deg));
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));
  }
  .sticker.selected{outline:none;}
  .sticker img{display:block;width:100%;height:100%;pointer-events:none;}
  .frame-overlay{position:absolute;inset:0;pointer-events:none;}
  .stage{touch-action:none;}
  .sticker-ctrl{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    display:none;flex-direction:column;gap:6px;background:rgba(20,16,31,.85);backdrop-filter:blur(8px);
    padding:7px;border-radius:18px;border:1px solid var(--line);z-index:6;}
  .sticker-ctrl.show{display:flex;}
  .sc-row{display:flex;gap:6px;justify-content:center;}
  .sticker-ctrl button{width:46px;height:42px;border:none;border-radius:12px;background:var(--surface-2);
    color:#fff;font-size:18px;cursor:pointer;line-height:1;touch-action:none;}
  .sticker-ctrl button:active{transform:scale(.9);background:var(--pink);}
  .sticker-ctrl button[data-a="del"]{background:#b23a5b;}
  .frame-overlay img{width:100%;height:100%;object-fit:fill;}

  /* ---- 괴도키드 변신 AR 오버레이 ---- */
  .ar-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:5;}
  .stage.ar-on .ar-overlay{display:block;}
  .stage.mirror .ar-overlay{transform:scaleX(-1);}
  .bg-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none;}
  .stage.bg-on .bg-overlay{display:block;}
  .stage.mirror .bg-overlay{transform:scaleX(-1);}
  .icon-btn.loading{opacity:.6;pointer-events:none;}
  .chip.loading{opacity:.55;pointer-events:none;}
  .countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    font-family:"Jua",sans-serif;font-size:140px;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6);z-index:8;pointer-events:none;}
  .countdown.show{display:flex;}
  .icon-btn.on{position:relative;}
  .icon-btn .badge{position:absolute;bottom:-2px;right:-2px;background:var(--pink);color:#fff;font-size:9px;font-weight:800;border-radius:8px;padding:1px 4px;line-height:1.2;}

  /* placeholder / permission state */
  .stage-msg{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:28px;color:var(--muted);
  }
  .stage-msg .big{font-family:"Jua";font-size:44px;color:var(--text);}
  .stage-msg p{margin:0;font-size:13px;line-height:1.6;max-width:260px;}
  .ghost-btn{
    margin-top:4px;padding:11px 20px;border-radius:14px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;
  }
  .ghost-btn:active{transform:scale(.96);}

  /* flash */
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  .flash.go{animation:flash .5s ease;}
  @keyframes flash{0%{opacity:0}12%{opacity:.9}100%{opacity:0}}

  /* sticker hint */
  .hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
    padding:7px 14px;border-radius:999px;font-size:12px;color:#fff;font-weight:600;
    white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;
  }
  .hint.show{opacity:1;}

  /* ---- tray ---- */
  .tray{
    flex:0 0 auto;display:flex;gap:10px;overflow-x:auto;padding:14px 16px 4px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .tray::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;width:66px;height:66px;border-radius:20px;border:2px solid var(--line);
    background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;
    transition:transform .12s, border-color .12s;overflow:hidden;
  }
  .chip:active{transform:scale(.92);}
  .chip.active{border-color:var(--mint);box-shadow:0 0 0 3px rgba(87,230,195,.25);}
  .chip img{width:70%;height:70%;object-fit:contain;pointer-events:none;}
  .chip .lbl{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted);font-weight:700;}
  .chip.none{font-family:"Jua";color:var(--muted);font-size:13px;}
  .chip.active.none{color:var(--mint);}
  .chip .emoji{font-size:30px;line-height:1;pointer-events:none;}

  /* ---- 배경 색 바 ---- */
  .bgbar{display:none;align-items:center;gap:8px;padding:8px 16px 0;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .bgbar.show{display:flex;}
  .bgbar::-webkit-scrollbar{display:none;}
  .bgbar-lbl{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--muted);}
  .bgbar .sw{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);
    cursor:pointer;padding:0;position:relative;}
  .bgbar .sw.on{border-color:var(--mint);box-shadow:0 0 0 3px rgba(87,230,195,.3);}
  .bgbar .sw.custom{display:grid;place-items:center;font-size:15px;background:var(--surface-2);overflow:hidden;}
  .bgbar .sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .bgbar .sw.img{width:44px;border-radius:9px;background-size:cover;background-position:center;}

  /* ---- controls ---- */
  .controls{
    flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:8px 26px 18px;gap:10px;
  }
  .side-slot{display:flex;align-items:center;gap:10px;}
  .side-slot.right{justify-content:flex-end;}
  .shutter{
    width:82px;height:82px;border-radius:50%;justify-self:center;cursor:pointer;border:none;
    background:conic-gradient(from 210deg,var(--pink),var(--yellow),var(--mint),var(--pink));
    padding:6px;display:grid;place-items:center;position:relative;
    transition:transform .1s;
  }
  .shutter:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed;}
  .shutter:active{transform:scale(.9);}
  .shutter .inner{
    width:100%;height:100%;border-radius:50%;background:#fff;
    box-shadow:inset 0 0 0 4px var(--grape-2);
    display:grid;place-items:center;font-family:"Jua";color:var(--grape-2);font-size:15px;
  }
  .mini-btn{
    padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
    color:var(--text);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .mini-btn:active{transform:scale(.94);}
  .mini-btn:disabled{opacity:.35;}

  /* ---- result ---- */
  .result{position:fixed;inset:0;background:rgba(10,7,18,.88);backdrop-filter:blur(10px);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;z-index:50;}
  .result.show{display:flex;}
  .result img{max-width:100%;max-height:62vh;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .result .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{padding:13px 22px;border-radius:16px;border:none;font-weight:800;font-size:15px;cursor:pointer;
    font-family:"Gothic A1";display:flex;align-items:center;gap:7px;}
  .btn.primary{background:linear-gradient(135deg,var(--pink),var(--yellow));color:#2a1a00;}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .btn:active{transform:scale(.95);}
  .result h2{font-family:"Jua";margin:0;font-size:22px;color:var(--text);}
  .sheet{position:fixed;inset:0;background:rgba(10,7,18,.7);backdrop-filter:blur(6px);
    display:none;align-items:flex-end;justify-content:center;z-index:60;}
  .sheet.show{display:flex;}
  .sheet-box{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;border:1px solid var(--line);}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-head h2{font-family:"Jua";margin:0;font-size:20px;}
  .sheet-head button{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
  .preset-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .preset-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
  .preset-row>span:first-child{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pr-btns{display:flex;gap:6px;flex:0 0 auto;}
  .pr-btns button{border:none;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;background:var(--mint);color:#04241d;}
  .pr-btns button.del{background:#b23a5b;color:#fff;}
  .preset-list .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px;line-height:1.6;}
</style>
</head>
<body>
  <header>
    <div class="brand"></div>
    <div class="top-btns">
      <button class="icon-btn" id="layoutBtn" title="구도 저장/불러오기">📁</button>
      <button class="icon-btn" id="cutBtn" title="인생네컷">🎞️</button>
      <button class="icon-btn" id="timerBtn" title="타이머">⏱️</button>
      <button class="icon-btn" id="mirrorBtn" title="좌우반전">🪞</button>
      <button class="icon-btn" id="flipBtn" title="카메라 전환">🔄</button>
    </div>
  </header>

  <div class="stage-wrap" style="position:relative">
    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <img id="photo" alt="">
      <canvas class="bg-overlay" id="bgOverlay"></canvas>
      <div id="layer"></div>
      <div class="frame-overlay" id="frameLayer"></div>
      <canvas class="ar-overlay" id="arOverlay"></canvas>
      <div class="flash" id="flash"></div>
      <div class="countdown" id="countdown"></div>
      <div class="hint" id="hint">한 손가락으로 이동 · 두 손가락으로 크기·회전 · 아래 버튼으로도 조절</div>
      <div class="stage-msg" id="stageMsg">
        <div class="big">📷</div>
        <p id="msgText">카메라를 준비하고 있어요…</p>
        <button class="ghost-btn" id="retryBtn" style="display:none">카메라 다시 시도</button>
        <label class="ghost-btn" style="display:inline-block">
          사진 올려서 쓰기
          <input type="file" id="uploadInput" accept="image/*" hidden>
        </label>
      </div>
    </div>
    <div class="sticker-ctrl" id="sctrl">
      <div class="sc-row">
        <button data-a="smaller" title="작게">➖</button>
        <button data-a="bigger" title="크게">➕</button>
        <button data-a="rotL" title="회전">↺</button>
        <button data-a="rotR" title="회전">↻</button>
        <button data-a="del" title="삭제">🗑️</button>
      </div>
    </div>
  </div>

  <div class="bgbar" id="bgbar">
    <span class="bgbar-lbl">배경</span>
    <button class="sw" data-c="transparent" title="투명" style="background:conic-gradient(#bbb 25%,#fff 0 50%,#bbb 0 75%,#fff 0);background-size:10px 10px"></button>
    <button class="sw" data-c="#ffffff" style="background:#ffffff"></button>
    <button class="sw" data-c="#111111" style="background:#111111"></button>
    <button class="sw" data-c="#FF5D9E" style="background:#FF5D9E"></button>
    <button class="sw" data-c="#57E6C3" style="background:#57E6C3"></button>
    <button class="sw" data-c="#7EC8FF" style="background:#7EC8FF"></button>
    <button class="sw" data-c="#FFD166" style="background:#FFD166"></button>
    <label class="sw custom" title="색 직접 고르기">🎨<input type="color" id="bgColorInput" value="#ffffff"></label>
    <span class="bgbar-lbl">사진</span>
    <button class="sw img" data-img="stickers/bg-office2.jpg" title="탐정사무소" style="background-image:url(stickers/bg-office2.jpg)"></button>
    <button class="sw img" data-img="stickers/bg-tropical2.jpg" title="트로피컬 랜드" style="background-image:url(stickers/bg-tropical2.jpg)"></button>
  </div>

  <div class="bgbar" id="cutbar">
    <span class="bgbar-lbl">네컷 프레임</span>
    <button class="sw" data-cut="#ffffff|#333333" style="background:#ffffff"></button>
    <button class="sw" data-cut="#111111|#ffffff" style="background:#111111"></button>
    <button class="sw" data-cut="#FF5D9E|#ffffff" style="background:#FF5D9E"></button>
    <button class="sw" data-cut="#57E6C3|#04241d" style="background:#57E6C3"></button>
    <button class="sw" data-cut="#FFD166|#5a3a00" style="background:#FFD166"></button>
    <span class="bgbar-lbl" style="margin-left:6px">셔터 누르면 4장 연속 촬영</span>
  </div>

  <div class="tray" id="tray"></div>

  <div class="controls">
    <div class="side-slot">
      <button class="mini-btn" id="clearBtn" disabled>🧹 지우기</button>
    </div>
    <button class="shutter" id="shutter" disabled><span class="inner">찰칵</span></button>
    <div class="side-slot right">
      <span style="font-size:11px;color:var(--muted);font-weight:700" id="counter"></span>
    </div>
  </div>

  <div class="result" id="result">
    <h2>이렇게 나왔어요!</h2>
    <img id="resultImg" alt="촬영 결과">
    <div class="row">
      <button class="btn primary" id="saveBtn">💾 저장</button>
      <button class="btn ghost" id="shareBtn" style="display:none">📤 공유</button>
      <button class="btn ghost" id="retakeBtn">↩ 다시 찍기</button>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-box">
      <div class="sheet-head"><h2>내 구도</h2><button id="sheetClose">✕</button></div>
      <button class="btn primary" id="saveCur" style="width:100%">💾 지금 구도 저장</button>
      <div class="preset-list" id="presetList"></div>
    </div>
  </div>

  <canvas id="canvas" style="display:none"></canvas>

<script>
/* ============ 프리셋 오버레이 (SVG) ============ */
const svg = (inner, vb="0 0 400 400") =>
  `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='${vb}'>${inner}</svg>`)}`;

const OVERLAYS = [
  { id:"none", name:"없음", type:"none" },
  { id:"bg_remove", name:"배경", type:"bg", emoji:"🎨" },
  { id:"kaito_poke", name:"괴도키드👉", type:"sticker", w:240, filter:true, preset:{fx:0.44, fy:0.5, hfit:0.95}, src:"stickers/kaito-kid-poke6.png" },
  { id:"kaito_kiss", name:"괴도키드💋", type:"sticker", w:240, filter:true, preset:{fx:0.58, fy:0.5, hfit:0.95}, src:"stickers/kaito-kid-kiss.png" },
  { id:"kaito_hand", name:"괴도키드🤚", type:"sticker", w:240, filter:true, preset:{fx:0.42, fy:0.5, hfit:0.95}, src:"stickers/kaito-kid-hand4.png" },
  { id:"kaito_half", name:"반쪽하트🫶", type:"sticker", w:240, filter:true, preset:{fx:0.42, fy:0.5, hfit:0.95}, src:"stickers/kaito-kid-half5.png" },
  { id:"amuro_punch", name:"아무로 주먹👊", type:"sticker", w:240, filter:true, preset:{fx:0.36, fy:0.46, hfit:0.62}, src:"stickers/amuro-punch2.png" },
  { id:"conan_kid_v", name:"코난&키드✌️", type:"group", src:"stickers/kaito-conan-v.png",
    items:[ {src:"stickers/kaito-kid-v3.png", w:240, fx:0.26, scale:1.2},
            {src:"stickers/kaito-conan-v.png", w:240, fx:0.74, scale:1.15} ] },
  { id:"kaito_ar", name:"모자변신🎩", type:"ar", arItem:"hat", src:"stickers/kaito-hat2.png" },
  { id:"conan_glasses", name:"코난안경👓", type:"ar", arItem:"glasses", src:"stickers/conan-glasses4.png" },
  { id:"conan_bowtie", name:"나비넥타이🎀", type:"ar", arItem:"bowtie", src:"stickers/conan-bowtie3.png" },
  { id:"pika_mask", name:"피카츄탈⚡", type:"ar", arItem:"pika", src:"stickers/pika-mask.png" },
  { id:"conan_watch", name:"코난시계⌚", type:"ar", arItem:"watch", src:"stickers/conan-watch4.png" },
];

/* ============ 상태 ============ */
const stage = document.getElementById('stage');
const video = document.getElementById('video');
const photo = document.getElementById('photo');
const layer = document.getElementById('layer');
const frameLayer = document.getElementById('frameLayer');
const stageMsg = document.getElementById('stageMsg');
const msgText = document.getElementById('msgText');
const retryBtn = document.getElementById('retryBtn');
const uploadInput = document.getElementById('uploadInput');
const shutter = document.getElementById('shutter');
const clearBtn = document.getElementById('clearBtn');
const flipBtn = document.getElementById('flipBtn');
const mirrorBtn = document.getElementById('mirrorBtn');
const flash = document.getElementById('flash');
const hint = document.getElementById('hint');
const tray = document.getElementById('tray');
const counter = document.getElementById('counter');

let stream = null;
let facing = "user";
let mode = null;            // 'camera' | 'photo'
let mirror = true;
let selected = null;        // currently selected sticker element
let activeFrame = null;     // {id, src}
let stickerCount = 0;

/* ============ 카메라 ============ */
// 프레임은 항상 3:4 고정 → 어느 기기서든 캐릭터 위치가 동일. (동적 비율 제거)
async function startCamera(){
  showMsg("카메라를 준비하고 있어요…", false);
  stopStream();
  try{
    // 화각 우선: 해상도 강제 없이 기본값으로 받는다. 고해상도 요청은 일부 폰(삼성 등)에서
    // 센서를 잘라(줌) 주므로, resizeMode:'none'만 주고 폭/높이는 지정하지 않아 가장 넓은 기본 화각을 얻는다.
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode: facing, resizeMode:'none' }, audio:false
      });
    }catch(_){
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode: facing }, audio:false
      });
    }
    // 전면 카메라 기본 확대 완화: 지원되면 줌을 최소(가장 넓은 화각)로.
    try{
      const track = stream.getVideoTracks()[0];
      const caps = track && track.getCapabilities ? track.getCapabilities() : null;
      if(caps && caps.zoom && typeof caps.zoom.min === 'number'){
        await track.applyConstraints({ advanced:[{ zoom: caps.zoom.min }] });
      }
    }catch(_){}
    video.srcObject = stream;
    await video.play().catch(()=>{});
    mode = "camera";
    photo.style.display = "none";
    video.style.display = "block";
    hideMsg();
    enableCapture(true);
  }catch(err){
    mode = null;
    enableCapture(false);
    let t = "카메라를 열 수 없어요.";
    if(err && (err.name==="NotAllowedError"||err.name==="SecurityError"))
      t = "카메라 권한이 필요해요. 브라우저에서 카메라 접근을 허용해 주세요.\n(이 미리보기 창에서 막히면 파일을 내려받아 브라우저로 열면 잘 돼요.)";
    else if(err && err.name==="NotFoundError") t = "연결된 카메라를 찾지 못했어요. 아래에서 사진을 올려 써보세요.";
    showMsg(t, true);
  }
}
function stopStream(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
function showMsg(t, retry){ msgText.textContent=t; stageMsg.style.display="flex"; retryBtn.style.display = retry?"inline-block":"none"; }
function hideMsg(){ stageMsg.style.display="none"; }
function enableCapture(on){ shutter.disabled=!on; }

flipBtn.addEventListener('click', ()=>{ facing = facing==="user" ? "environment" : "user"; if(mode!=="photo") startCamera(); });
mirrorBtn.addEventListener('click', ()=>{ mirror=!mirror; stage.classList.toggle('mirror',mirror); mirrorBtn.classList.toggle('on',mirror); autosave(); });

uploadInput.addEventListener('change', e=>{

/* ============ 트레이(오버레이 선택) ============ */
OVERLAYS.forEach(o=>{
  const chip = document.createElement('button');
  chip.className = 'chip' + (o.type==="none" ? " none" : "");
  chip.dataset.id = o.id;
  if(o.type==="none"){ chip.textContent="없음"; }
  else if(o.emoji){ chip.innerHTML = `<span class="emoji">${o.emoji}</span><span class="lbl">${o.name}</span>`; }
  else { chip.innerHTML = `<img src="${o.src}" alt=""><span class="lbl">${o.name}</span>`; }
  chip.addEventListener('click', ()=>onPick(o, chip));
  tray.appendChild(chip);
});

async function onPick(o, chip){
  if(o.type==="none"){
    activeFrame=null; frameLayer.innerHTML="";
    setActiveChip(chip);
    autosave();
    return;
  }
  if(o.type==="frame"){
    activeFrame = o;
    frameLayer.innerHTML = `<img src="${o.src}" alt="">`;
    setActiveChip(chip);
    updateClear();
    return;
  }
  if(o.type==="ar"){
    // 얼굴 트래킹 아이템(모자/안경) 토글 — 각각 독립적으로 켜고 끔
    chip.classList.add('loading');
    KID.toggle(o.arItem||'hat').then(isOn=>{ chip.classList.remove('loading'); chip.classList.toggle('active', isOn); });
    return;
  }
  if(o.type==="bg"){
    // 배경 제거 토글 (필터처럼 트레이에서 켜고 끔) + 색 선택 바 표시
    chip.classList.add('loading');
    BG.toggle().then(()=>{
      chip.classList.remove('loading');
      chip.classList.toggle('active', BG.on);
      bgbar.classList.toggle('show', BG.on);
    });
    return;
  }
  // 모든 필터/그룹 제거 (상호 배타적). 함수 선언이라 이 블록 위에서도 호출 가능(호이스팅).
  function clearFilters(){
    [...layer.querySelectorAll('.sticker')].forEach(el=>{
      const ov=OVERLAYS.find(x=>x.id===el.dataset.id);
      if((ov && ov.filter) || el.dataset.group) removeSticker(el);
    });
    [...tray.children].forEach(c=>{ const ov=OVERLAYS.find(x=>x.id===c.dataset.id); if(ov && (ov.filter || ov.type==='group')) c.classList.remove('active'); });
  }
  // 그룹 필터: 스티커 여러 개를 한 번에 (예: 코난+키드). 탭 토글, 상호 배타, 각 스티커 위치·크기 기억.
  if(o.type==="group"){
    const present=[...layer.querySelectorAll('.sticker')].filter(el=>el.dataset.group===o.id);
    if(present.length){ present.forEach(removeSticker); chip.classList.remove('active'); return; }
    clearFilters();
    const r=stage.getBoundingClientRect();
    (o.items||[]).forEach((it,idx)=>{
      const itemId=o.id+'__'+idx;
      const s=fpos[itemId];
      const tf = s ? {cx:r.width*s.fx, cy:r.height*s.fy, scale:s.scale, rot:s.rot||0}
                   : {cx:r.width*(it.fx??0.5), cy:r.height*(it.fy??0.5), scale:it.scale??1, rot:0};
      const el=addStickerEx({id:itemId, w:it.w||240, src:it.src}, tf, false);
      el.dataset.group=o.id;
    });
    chip.classList.add('active');
    return;
  }
  // 고정 필터: 한 번에 하나만. 탭하면 교체, 같은 걸 다시 탭하면 꺼짐. (각자 위치·크기 기억)
  if(o.filter){
    const existing=[...layer.querySelectorAll('.sticker')].find(el=>el.dataset.id===o.id);
    if(existing){ removeSticker(existing); chip.classList.remove('active'); return; }
    clearFilters();
    const r=stage.getBoundingClientRect();
    const saved=fpos[o.id];
    if(saved){
      addStickerEx(o, {cx:r.width*saved.fx, cy:r.height*saved.fy, scale:saved.scale, rot:saved.rot||0}, true);
    } else {
      const p=o.preset||{};
      // 세로(높이) 기준 크기: 캐릭터가 프레임 높이의 hfit 비율이 되도록 → 전신이 프레임 안에 맞음(세로로 안 넘침).
      const img=chip.querySelector('img');
      const aspect=(img&&img.naturalWidth)? img.naturalWidth/img.naturalHeight : 0.5;   // 폭/높이
      const hfit=p.hfit ?? 0.95;
      const scale=clamp(hfit*(4/3)*aspect/0.6, .2, 6);   // 프레임 3:4 기준
      const boxWFrac=(o.w||240)/REF_W*scale;
      // 바깥쪽 가장자리에 딱 붙임 → 옆 배경 빈 공간 제거
      const rightSide=(p.fx ?? 0.42) >= 0.5;
      const fx=rightSide ? (1.02 - boxWFrac/2) : (boxWFrac/2 - 0.02);
      addStickerEx(o, {cx:r.width*fx, cy:r.height*(p.fy??0.5), scale, rot:0}, true);
    }
    chip.classList.add('active');
    return;
  }
  // sticker: add a new draggable instance
  addSticker(o);
  flashHint();
}
function setActiveChip(chip){
  // only frames + none behave as a single toggle-highlight
  [...tray.children].forEach(c=>{ if(c.dataset.id==="none"||OVERLAYS.find(x=>x.id===c.dataset.id)?.type==="frame") c.classList.remove('active'); });
  chip.classList.add('active');
}

/* ============ 스티커 조작 (이동/크기/회전) ============ */
function addStickerEx(o, tf, doSelect){
  const el = document.createElement('div');
  el.className = 'sticker';
  const rect = stage.getBoundingClientRect();
  el.dataset.w = o.w || 240;
  el.dataset.id = o.id;
  el.dataset.src = o.src;
  el.dataset.cx = tf ? tf.cx : rect.width/2;
  el.dataset.cy = tf ? tf.cy : rect.height/2;
  el.dataset.scale = tf ? tf.scale : 1;
  el.dataset.rot = tf ? tf.rot : 0;
  el.innerHTML = `<img src="${o.src}" alt="">`;
  layer.appendChild(el);
  applyTransform(el);
  if(doSelect) select(el);
  stickerCount++;
  updateClear();
  return el;
}
function addSticker(o){ return addStickerEx(o, null, true); }
const REF_W = 400;   // 기준 스테이지 폭. 크기를 화면 폭 비율로 계산 → 기기 달라도 프레임 대비 동일 비율.
let stageWpx = 0, lastStageW = 0, lastStageH = 0;
function curStageW(){ const w = stage.getBoundingClientRect().width; if(w) stageWpx = w; return stageWpx || REF_W; }
function applyTransform(el){
  const w = (+el.dataset.w)/REF_W * curStageW() * (+el.dataset.scale);
  el.style.width = w + "px";
  el.style.left = el.dataset.cx + "px";
  el.style.top  = el.dataset.cy + "px";
  el.style.setProperty('--rot', el.dataset.rot + "deg");
  autosave();
}
// 화면 크기가 바뀌면(회전 등) 위치는 비율로 재배치, 크기는 자동 반영
function reflowStickers(){
  const r = stage.getBoundingClientRect();
  if(lastStageW && r.width && (r.width!==lastStageW || r.height!==lastStageH)){
    const rx = r.width/lastStageW, ry = r.height/lastStageH;
    [...layer.querySelectorAll('.sticker')].forEach(el=>{
      el.dataset.cx = (+el.dataset.cx)*rx; el.dataset.cy = (+el.dataset.cy)*ry;
    });
  }
  lastStageW = r.width||lastStageW; lastStageH = r.height||lastStageH; stageWpx = r.width||stageWpx;
  [...layer.querySelectorAll('.sticker')].forEach(applyTransform);
}
window.addEventListener('resize', reflowStickers);
function select(el){
  if(selected) selected.classList.remove('selected');
  selected = el;
  // 캐릭터를 잡으면(선택) 작은 크기·회전 바를 띄운다. 안 잡으면 숨김(설정 그대로 고정).
  if(el) sctrl.classList.add('show'); else sctrl.classList.remove('show');
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angle=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* global multi-touch gesture handling for the selected sticker */
const sctrl=document.getElementById('sctrl');
const ptrs=new Map();
let gmode=null,gstart=null,dragId=null,downSticker=null,moved=false,lastTapT=0,lastTapEl=null;

function removeSticker(el){ el.remove(); stickerCount=Math.max(0,stickerCount-1); if(selected===el) select(null); updateClear(); }

stage.addEventListener('pointerdown', e=>{
  const st = e.target.closest ? e.target.closest('.sticker') : null;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  moved=false; downSticker=st;
  if(st){
    select(st);
    const now=Date.now();
    if(now-lastTapT<320 && lastTapEl===st){ removeSticker(st); lastTapT=0; lastTapEl=null; return; }
    lastTapT=now; lastTapEl=st;
  }
  if(ptrs.size===2 && selected){
    const p=[...ptrs.values()];
    gmode='pinch';
    gstart={dist:dist(p[0],p[1]),ang:angle(p[0],p[1]),scale:+selected.dataset.scale,rot:+selected.dataset.rot};
  } else if(ptrs.size===1){
    if(st){ gmode='drag'; dragId=e.pointerId; gstart={cx:+st.dataset.cx,cy:+st.dataset.cy,px:e.clientX,py:e.clientY}; }
    else { gmode=null; }
  }
});

window.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gmode==='pinch' && selected){
    const p=[...ptrs.values()]; if(p.length<2) return;
    selected.dataset.scale=clamp(gstart.scale*(dist(p[0],p[1])/gstart.dist),.2,6);
    selected.dataset.rot=gstart.rot+(angle(p[0],p[1])-gstart.ang);
    applyTransform(selected); moved=true;
  } else if(gmode==='drag' && selected && e.pointerId===dragId){
    selected.dataset.cx=gstart.cx+(e.clientX-gstart.px);
    selected.dataset.cy=gstart.cy+(e.clientY-gstart.py);
    applyTransform(selected); moved=true;
  }
});

function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size===1 && selected){
    const [id,pt]=[...ptrs.entries()][0];
    gmode='drag'; dragId=id; gstart={cx:+selected.dataset.cx,cy:+selected.dataset.cy,px:pt.x,py:pt.y};
  } else if(ptrs.size===0){
    if(gmode!=='pinch' && !downSticker && !moved) select(null);
    gmode=null; downSticker=null;
  }
}
window.addEventListener('pointerup', endPtr);
window.addEventListener('pointercancel', endPtr);

/* control bar: tap or press-and-hold to repeat */
function doAction(a){
  if(!selected) return;
  const step=Math.max(8, stage.getBoundingClientRect().width*0.03);
  if(a==='bigger') selected.dataset.scale=clamp(+selected.dataset.scale*1.08,.2,6);
  else if(a==='smaller') selected.dataset.scale=clamp(+selected.dataset.scale/1.08,.2,6);
  else if(a==='rotL') selected.dataset.rot=+selected.dataset.rot-6;
  else if(a==='rotR') selected.dataset.rot=+selected.dataset.rot+6;
  else if(a==='left')  selected.dataset.cx=+selected.dataset.cx-step;
  else if(a==='right') selected.dataset.cx=+selected.dataset.cx+step;
  else if(a==='up')    selected.dataset.cy=+selected.dataset.cy-step;
  else if(a==='down')  selected.dataset.cy=+selected.dataset.cy+step;
  else if(a==='front'){ layer.appendChild(selected); return; }
  else if(a==='del'){ removeSticker(selected); return; }
  applyTransform(selected);
}
let repTimer=null;
sctrl.addEventListener('pointerdown', e=>{
  const b=e.target.closest('button'); if(!b||!selected) return;
  e.preventDefault();
  const a=b.dataset.a; doAction(a);
  if(a!=='del'&&a!=='front'){ clearInterval(repTimer); repTimer=setInterval(()=>doAction(a),70); }
});
const stopRep=()=>{ clearInterval(repTimer); repTimer=null; };
sctrl.addEventListener('pointerup',stopRep);
sctrl.addEventListener('pointercancel',stopRep);
sctrl.addEventListener('pointerleave',stopRep);

clearBtn.addEventListener('click', ()=>{

/* ============ 촬영 ============ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const result = document.getElementById('result');
const resultImg = document.getElementById('resultImg');
const saveBtn = document.getElementById('saveBtn');
const shareBtn = document.getElementById('shareBtn');
const retakeBtn = document.getElementById('retakeBtn');
let lastBlob = null;

function coverDraw(c, source, sw, sh, dw, dh){
  const sr = sw/sh, dr = dw/dh;
  let cw, ch, cx, cy;
  if(sr > dr){ ch=sh; cw=sh*dr; cx=(sw-cw)/2; cy=0; }
  else { cw=sw; ch=sw/dr; cx=0; cy=(sh-ch)/2; }
  c.drawImage(source, cx, cy, cw, ch, 0, 0, dw, dh);
}
function drawCover(source, sw, sh, dw, dh){ coverDraw(ctx, source, sw, sh, dw, dh); }

function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }

/* ============ 셀프 타이머 / 네컷 ============ */
let timerSec=0, counting=false;
let cutMode=false;
let cutStyle={ bg:'#ffffff', fg:'#333333' };
const timerBtn=document.getElementById('timerBtn');
const countdownEl=document.getElementById('countdown');
function updateTimerBtn(){
  timerBtn.classList.toggle('on', timerSec>0);
  const old=timerBtn.querySelector('.badge'); if(old) old.remove();
  if(timerSec>0){ const b=document.createElement('span'); b.className='badge'; b.textContent=timerSec+'s'; timerBtn.appendChild(b); }
}
timerBtn.addEventListener('click', ()=>{
  timerSec = timerSec===0?3 : timerSec===3?5 : timerSec===5?10 : 0;
  updateTimerBtn(); toast(timerSec>0?`타이머 ${timerSec}초`:'타이머 끔');
});
function runCountdown(sec){
  return new Promise(res=>{
    let n=sec; countdownEl.textContent=n; countdownEl.classList.add('show');
    const iv=setInterval(()=>{ n--; if(n<=0){ clearInterval(iv); countdownEl.classList.remove('show'); res(); } else countdownEl.textContent=n; }, 1000);
  });
}

function shotSize(){
  const rect = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  return { W: Math.round(rect.width*dpr), H: Math.round(rect.height*dpr), dpr };
}
function doFlash(){ flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }

// 한 장(배경+AR+스티커+프레임)을 주어진 캔버스에 그린다. 단일컷/네컷 공용.
async function drawShot(cnv, cx, W, H, dpr){
  cnv.width = W; cnv.height = H;
  cx.save();
  if(mirror){ cx.translate(W,0); cx.scale(-1,1); }
  if(mode==="camera" && video.videoWidth){
    if(BG.on && BG.ready){ BG.captureBase(cx, W, H); }
    else coverDraw(cx, video, video.videoWidth, video.videoHeight, W, H);
  } else if(mode==="photo" && photo.naturalWidth){
    coverDraw(cx, photo, photo.naturalWidth, photo.naturalHeight, W, H);
  } else { cx.fillStyle="#000"; cx.fillRect(0,0,W,H); }
  KID.captureDraw(cx, W, H);
  cx.restore();
  // 스티커 (미러 안 함)
  for(const el of [...layer.querySelectorAll('.sticker')]){
    const img = el.querySelector('img');
    const w = (+el.dataset.w)/REF_W * W * (+el.dataset.scale);   // 화면 폭 비율 기준(캔버스 폭 W = 스테이지폭*dpr)
    const h = w * ((img.naturalHeight||1)/(img.naturalWidth||1));
    const px = (+el.dataset.cx)*dpr, py = (+el.dataset.cy)*dpr;
    const rot = (+el.dataset.rot)*Math.PI/180;
    cx.save(); cx.translate(px, py); cx.rotate(rot); cx.drawImage(img, -w/2, -h/2, w, h); cx.restore();
  }
  if(activeFrame){ const fimg = await loadImg(activeFrame.src); cx.drawImage(fimg, 0, 0, W, H); }
}

function showResult(blob){ lastBlob=blob; if(resultImg.src) URL.revokeObjectURL(resultImg.src); resultImg.src=URL.createObjectURL(blob); setTimeout(()=>result.classList.add('show'), 260); }

// 네컷 합성: 캡처된 4장을 2x2 프레임 카드로.
function composeFourCut(shots){
  const tw = 520, th = Math.round(tw * (shots[0].height/shots[0].width));
  const border = Math.round(tw*0.06), gap = Math.round(tw*0.05), footer = Math.round(tw*0.42);
  const cols=2, rows=2;
  const cardW = border*2 + cols*tw + (cols-1)*gap;
  const cardH = border*2 + rows*th + (rows-1)*gap + footer;
  const c = document.createElement('canvas'); c.width=cardW; c.height=cardH;
  const x = c.getContext('2d');
  x.fillStyle = cutStyle.bg; x.fillRect(0,0,cardW,cardH);
  for(let i=0;i<4;i++){
    const col=i%2, row=(i/2)|0;
    const dx=border+col*(tw+gap), dy=border+row*(th+gap);
    x.drawImage(shots[i], dx, dy, tw, th);
  }
  const d=new Date();
  const ds=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  x.fillStyle = cutStyle.fg; x.textAlign='center';
  x.font = `700 ${Math.round(footer*0.34)}px "Jua", sans-serif`;
  x.fillText('찰칵 네컷', cardW/2, cardH - border - footer*0.42);
  x.font = `700 ${Math.round(footer*0.24)}px sans-serif`;
  x.fillText(ds, cardW/2, cardH - border - footer*0.08);
  return c;
}

async function shootFourCut(){
  counting=true; enableCapture(false);
  try{
    const {W,H,dpr}=shotSize();
    const shots=[];
    for(let i=0;i<4;i++){
      toast(`${i+1} / 4`);
      await runCountdown(timerSec>0?timerSec:3);
      const c=document.createElement('canvas');
      await drawShot(c, c.getContext('2d'), W, H, dpr);
      shots.push(c); doFlash();
      await new Promise(r=>setTimeout(r, 700));
    }
    composeFourCut(shots).toBlob(showResult, 'image/png');
  } finally { counting=false; enableCapture(mode==="camera"||mode==="photo"); }
}

async function shootSingle(){
  counting=true;
  try{
    if(timerSec>0){ await runCountdown(timerSec); }
    const {W,H,dpr}=shotSize();
    await drawShot(canvas, ctx, W, H, dpr);
    doFlash();
    canvas.toBlob(showResult, 'image/png');
  } finally { counting=false; }
}

const KID = (()=>{

  const GLASS_ANCHOR_Y = 0.50;
  const GLASS_LIFT_MULT = -0.13;   // 눈라인 위/아래 미세조정 (양수=위로, 음수=아래로). 살짝 내려씀.
  const BOWTIE_SRC = "stickers/conan-bowtie3.png";     // 코난 빨간 나비넥타이(레퍼런스 기반) → 턱 아래 목
  // 나비넥타이: 폭=눈사이거리*배수, drop=턱에서 아래로
  const BOW_WIDTH_MULT = 1.25;
  const BOW_DROP = 0.8;
  const PIKA_SRC = "stickers/pika-mask.png";           // 피카츄 탈(가운데 얼굴 구멍) → 얼굴에 씌움

  const PIKA_WIDTH_MULT = 2.0;
  const PIKA_ANCHOR_X = 0.50;
  const PIKA_ANCHOR_Y = 0.607;
  const PIKA_CENTER = 0.25;
  const HAND_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  const WATCH_SRC = "stickers/conan-watch4.png";   // 코난 시계(뚜껑 하나만 열린 조준경) → 손목에 트래킹
  // 시계: 폭=손바닥폭*배수, 앵커=이미지 내 밴드고리(손목 들어가는) 중심. 뚜껑은 그 위로 세워짐.
  const WATCH_WIDTH_MULT = 1.6;
  const WATCH_ANCHOR_X = 0.40;
  const WATCH_ANCHOR_Y = 0.76;

  // ── 튜너블 (배치 미세조정) ──
  // 모자: 폭=눈사이거리*배수, lift=눈라인 위로 올림, 앵커=이미지 내 '머리에 얹히는' 지점
  const HAT_WIDTH_MULT = 3.2;   // 가로 살짝 넓게
  const HAT_VSCALE     = 0.8;   // 세로 눌러서 덜 길게
  const HAT_LIFT_MULT  = 0.75;
  const HAT_ANCHOR_X = 0.50;
  const HAT_ANCHOR_Y = 0.74;   // 챙 근처(하단). 이 점이 이마에 닿음
  // 모노클: 폭=한쪽 눈폭*배수, 앵커=이미지 내 렌즈 중심
  const MON_WIDTH_MULT = 2.0;
  const MON_ANCHOR_X = 0.42;
  const MON_ANCHOR_Y = 0.30;

  const arOverlay = document.getElementById('arOverlay');
  const arCtx = arOverlay.getContext('2d');
  const kidBtn = document.getElementById('kidBtn');  // 헤더 버튼 제거됨 → null 가능 (트레이 칩으로 토글)

  const items = { hat:false, glasses:false, bowtie:false, pika:false, watch:false };   // 얼굴/손 트래킹 아이템별 on/off
  const anyOn = ()=> items.hat || items.glasses || items.bowtie || items.pika || items.watch;
  const faceItemsOn = ()=> items.hat || items.glasses || items.bowtie || items.pika;   // 얼굴 모델 필요
  let landmarker=null, loading=false, loadFailed=false;
  let handModel=null, handLoading=false, handFailed=false, lastHands=[];
  let hatImg=null, glassesImg=null, bowtieImg=null, pikaImg=null, watchImg=null, rafId=null, lastVideoTime=-1, lastFaces=[];

  function loadImg(src){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }
  async function ensureAsset(item){
    if(item==='hat' && !hatImg) hatImg=await loadImg(HAT_SRC);
    if(item==='glasses' && !glassesImg) glassesImg=await loadImg(GLASSES_SRC);
    if(item==='bowtie' && !bowtieImg) bowtieImg=await loadImg(BOWTIE_SRC);
    if(item==='pika' && !pikaImg) pikaImg=await loadImg(PIKA_SRC);
    if(item==='watch' && !watchImg) watchImg=await loadImg(WATCH_SRC);
  }

  async function ensureModel(){
    if(landmarker || loadFailed) return landmarker;
    if(loading) return null;
    loading=true; kidBtn && kidBtn.classList.add('loading');
    try{
      const vision = await import(`${MP_BASE}/vision_bundle.mjs`);
      const { FaceLandmarker, FilesetResolver } = vision;
      const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
      landmarker = await FaceLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
        runningMode: "VIDEO", numFaces: 5,
      });
    }catch(err){ loadFailed=true; console.warn('[괴도키드] 모델 로드 실패 — AR 없이 계속', err); }
    finally{ loading=false; kidBtn && kidBtn.classList.remove('loading'); }
    return landmarker;
  }

  async function ensureHandModel(){
    if(handModel || handFailed) return handModel;
    if(handLoading) return null;
    handLoading=true;
    try{
      const vision = await import(`${MP_BASE}/vision_bundle.mjs`);
      const { HandLandmarker, FilesetResolver } = vision;
      const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
      const opts = (delegate)=>({ baseOptions:{ modelAssetPath:HAND_MODEL_URL, delegate }, runningMode:"VIDEO", numHands:2 });
      try{ handModel = await HandLandmarker.createFromOptions(fileset, opts("GPU")); }
      catch(_){ handModel = await HandLandmarker.createFromOptions(fileset, opts("CPU")); }
    }catch(err){ handFailed=true; console.warn('[시계] 손 모델 로드 실패', err); }
    finally{ handLoading=false; }
    return handModel;
  }

  // 비디오 프레임(0~1) → 스테이지 cover 공간(px). object-fit:cover 동일 계산. (미러는 CSS/호출측 담당)
  function coverMap(cw, ch){
    const vw=video.videoWidth||1, vh=video.videoHeight||1;
    const sr=vw/vh, dr=cw/ch; let scale,offX,offY;
    if(sr>dr){ scale=ch/vh; offX=(cw-vw*scale)/2; offY=0; }
    else { scale=cw/vw; offX=0; offY=(ch-vh*scale)/2; }
    return {scale,offX,offY,vw,vh};
  }
  // 얼굴 프레임: 두 눈 중앙/눈사이거리/기울기 + 한쪽(오른) 눈 중심·폭
  function faceFrame(lm, cw, ch){
    const m=coverMap(cw,ch);
    const toPx=p=>({x:m.offX+p.x*m.vw*m.scale, y:m.offY+p.y*m.vh*m.scale});
    const eR=toPx(lm[33]), eL=toPx(lm[263]);       // 33=오른눈 바깥, 263=왼눈 바깥
    const cx=(eR.x+eL.x)/2, cy=(eR.y+eL.y)/2;
    const interI=Math.hypot(eL.x-eR.x, eL.y-eR.y)||1;
    const roll=Math.atan2(eL.y-eR.y, eL.x-eR.x);
    const lIn=toPx(lm[362]);                        // 362=왼눈 안쪽 → 반대쪽 눈에 모노클
    const reCx=(eL.x+lIn.x)/2, reCy=(eL.y+lIn.y)/2;
    const eyeW=Math.hypot(lIn.x-eL.x, lIn.y-eL.y)||1;
    const chin=toPx(lm[152]);                       // 152=턱 끝
    const jL=toPx(lm[234]), jR=toPx(lm[454]);       // 볼(턱) 좌우
    const faceW=Math.hypot(jR.x-jL.x, jR.y-jL.y)||1;
    return {cx,cy,interI,roll,reCx,reCy,eyeW,chin,faceW};
  }
  function drawHat(ctx, cw, ch, lm){
    if(!hatImg || !lm) return;
    const f=faceFrame(lm,cw,ch);
    const up={x:Math.sin(f.roll), y:-Math.cos(f.roll)};
    const lift=f.interI*HAT_LIFT_MULT;
    const ax=f.cx+up.x*lift, ay=f.cy+up.y*lift;
    const w=f.interI*HAT_WIDTH_MULT, h=w*(hatImg.naturalHeight/hatImg.naturalWidth)*HAT_VSCALE;
    ctx.save(); ctx.translate(ax,ay); ctx.rotate(f.roll);
    ctx.drawImage(hatImg, -w*HAT_ANCHOR_X, -h*HAT_ANCHOR_Y, w, h); ctx.restore();
  }
  function drawGlasses(ctx, cw, ch, lm){
    if(!glassesImg || !lm) return;
    const f=faceFrame(lm,cw,ch);
    const up={x:Math.sin(f.roll), y:-Math.cos(f.roll)};
    const lift=f.interI*GLASS_LIFT_MULT;
    const ax=f.cx+up.x*lift, ay=f.cy+up.y*lift;
    const w=f.interI*GLASS_WIDTH_MULT, h=w*(glassesImg.naturalHeight/glassesImg.naturalWidth);
    ctx.save(); ctx.translate(ax,ay); ctx.rotate(f.roll);
    ctx.drawImage(glassesImg, -w*GLASS_ANCHOR_X, -h*GLASS_ANCHOR_Y, w, h); ctx.restore();
  }
  function drawBowtie(ctx, cw, ch, lm){
    if(!bowtieImg || !lm) return;
    const f=faceFrame(lm,cw,ch);
    const down={x:-Math.sin(f.roll), y:Math.cos(f.roll)};
    const off=f.interI*BOW_DROP;
    const ax=f.chin.x+down.x*off, ay=f.chin.y+down.y*off;
    const w=f.interI*BOW_WIDTH_MULT, h=w*(bowtieImg.naturalHeight/bowtieImg.naturalWidth);
    ctx.save(); ctx.translate(ax,ay); ctx.rotate(f.roll);
    ctx.drawImage(bowtieImg, -w*0.5, -h*0.5, w, h); ctx.restore();
  }
  function drawPika(ctx, cw, ch, lm){
    if(!pikaImg || !lm) return;
    const f=faceFrame(lm,cw,ch);
    const fx=f.cx+(f.chin.x-f.cx)*PIKA_CENTER, fy=f.cy+(f.chin.y-f.cy)*PIKA_CENTER;
    const w=f.faceW*PIKA_WIDTH_MULT, h=w*(pikaImg.naturalHeight/pikaImg.naturalWidth);
    ctx.save(); ctx.translate(fx,fy); ctx.rotate(f.roll);
    ctx.drawImage(pikaImg, -w*PIKA_ANCHOR_X, -h*PIKA_ANCHOR_Y, w, h); ctx.restore();
  }
  function drawAll(ctx, cw, ch, lm){
    if(items.pika) drawPika(ctx,cw,ch,lm);      // 얼굴 탈(맨 아래, 구멍으로 얼굴 보임)
    if(items.bowtie) drawBowtie(ctx,cw,ch,lm);
    if(items.glasses) drawGlasses(ctx,cw,ch,lm);
    if(items.hat) drawHat(ctx,cw,ch,lm);          // 모자(맨 위)
  }

  // 손 21개 랜드마크 → 손목 위치/손바닥 폭/팔뚝(팔꿈치) 방향
  function handFrame(lm, cw, ch){
    const m=coverMap(cw,ch);
    const toPx=p=>({x:m.offX+p.x*m.vw*m.scale, y:m.offY+p.y*m.vh*m.scale});
    const wrist=toPx(lm[0]), midMcp=toPx(lm[9]);
    const idx=toPx(lm[5]), pinky=toPx(lm[17]);
    const handW=Math.hypot(pinky.x-idx.x, pinky.y-idx.y)||1;   // 손바닥 폭 ≈ 손목 폭
    const dx=wrist.x-midMcp.x, dy=wrist.y-midMcp.y;            // 손목→손 반대편 = 팔꿈치 방향
    const len=Math.hypot(dx,dy)||1;
    return {wrist, handW, dir:{x:dx/len,y:dy/len}, ang:Math.atan2(dy,dx)};
  }
  function drawWatch(ctx, cw, ch, lm){
    if(!watchImg || !lm) return;
    const f=handFrame(lm,cw,ch);
    const w=f.handW*WATCH_WIDTH_MULT, h=w*(watchImg.naturalHeight/watchImg.naturalWidth);
    // 시계를 손목보다 살짝 팔꿈치 쪽으로 내려 얹음
    const ox=f.wrist.x+f.dir.x*(f.handW*0.15), oy=f.wrist.y+f.dir.y*(f.handW*0.15);
    // 눕히지 않고 항상 세워서(조준경이 카메라를 향하게) 얹는다. rotate 0.
    ctx.save(); ctx.translate(ox,oy);
    ctx.drawImage(watchImg, -w*WATCH_ANCHOR_X, -h*WATCH_ANCHOR_Y, w, h); ctx.restore();
  }

  function sizeOverlay(){
    const r=stage.getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,3);
    const w=Math.round(r.width*dpr), h=Math.round(r.height*dpr);
    if(arOverlay.width!==w||arOverlay.height!==h){ arOverlay.width=w; arOverlay.height=h; }
    return {w,h};
  }
  function clearOverlay(){ arCtx.clearRect(0,0,arOverlay.width,arOverlay.height); }

  async function loop(){
    if(!anyOn()) return;
    rafId=requestAnimationFrame(loop);
    if(mode!=="camera"||!video.videoWidth){ lastFaces=[]; lastHands=[]; clearOverlay(); return; }
    if(video.currentTime===lastVideoTime) return;
    lastVideoTime=video.currentTime;
    const {w,h}=sizeOverlay(); arCtx.clearRect(0,0,w,h);
    const ts=performance.now();
    if(faceItemsOn() && landmarker){
      let res=null; try{ res=landmarker.detectForVideo(video, ts); }catch(e){}
      lastFaces = (res && res.faceLandmarks) ? res.faceLandmarks : [];
      lastFaces.forEach(f=>drawAll(arCtx,w,h,f));
    } else lastFaces=[];
    if(items.watch && handModel){
      let hr=null; try{ hr=handModel.detectForVideo(video, ts); }catch(e){}
      lastHands = (hr && hr.landmarks) ? hr.landmarks : [];
      lastHands.forEach(hm=>drawWatch(arCtx,w,h,hm));
    } else lastHands=[];
  }

  async function enable(item){
    items[item]=true; stage.classList.add('ar-on'); kidBtn && kidBtn.classList.add('on');
    await ensureAsset(item);
    if(item==='watch') await ensureHandModel(); else await ensureModel();
    const failed = item==='watch' ? handFailed : loadFailed;
    if(failed){ items[item]=false; if(!anyOn()){ stage.classList.remove('ar-on'); kidBtn && kidBtn.classList.remove('on'); } toast('AR 모델을 불러오지 못했어요'); return; }
    lastVideoTime=-1; if(!rafId) loop();
  }
  function disable(item){
    items[item]=false;
    if(!anyOn()){
      stage.classList.remove('ar-on'); kidBtn && kidBtn.classList.remove('on');
      if(rafId){ cancelAnimationFrame(rafId); rafId=null; } lastFaces=[]; lastHands=[]; clearOverlay();
    }
  }
  async function toggle(item){ item=item||'hat'; if(items[item]) disable(item); else await enable(item); return items[item]; }
  kidBtn && kidBtn.addEventListener('click', ()=>toggle('hat'));

  // 캡처: 현재 얼굴에 켜진 아이템(모자/안경)을 대상 ctx(미러 블록 안)에 그린다.
  function captureDraw(targetCtx, W, H){
    if(!anyOn()) return;
    if(lastFaces.length) lastFaces.forEach(f=>drawAll(targetCtx, W, H, f));
    if(items.watch && lastHands.length) lastHands.forEach(hm=>drawWatch(targetCtx, W, H, hm));
  }

  // 모델 미리 로드 (카메라 시작 시 백그라운드로 → 필터 자동맞춤이 즉각 되게)
  async function preload(){ try{ await ensureModel(); }catch(_){} }
  // 현재 프레임에서 얼굴폭을 측정해 스테이지폭 대비 비율로 반환 (AR 안 켜도 1회 측정). 얼굴 없으면 null.
  async function measureOnce(){
    if(mode!=="camera" || !video.videoWidth) return null;
    await ensureModel();
    if(loadFailed || !landmarker) return null;
    let res=null; try{ res=landmarker.detectForVideo(video, performance.now()); }catch(e){ return null; }
    if(res && res.faceLandmarks && res.faceLandmarks.length){
      const {w,h}=sizeOverlay();
      const f=faceFrame(res.faceLandmarks[0], w, h);
      return f.faceW / w;
    }
    return null;
  }

  return { get on(){ return anyOn(); }, isOn:(item)=>!!items[item], captureDraw, toggle, preload, measureOnce };
})();

/* ============================================================
   배경 제거 (MediaPipe Selfie Segmentation)
   - 인물만 남기고 배경을 선택한 색(또는 투명)으로 교체.
   - 라이브: bgOverlay 캔버스를 색으로 채운 뒤 인물 영역을 destination-out 으로 뚫어 비디오가 비치게 함.
   - 캡처: 오프스크린에 비디오를 인물 마스크로 잘라 색 위에 합성. (미러 블록 안에서 호출)
   ============================================================ */
const BG = (()=>{
  const MP_VER = "0.10.35";
  const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
  const WASM_URL = `${MP_BASE}/wasm`;
  const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";

  const bgOverlay = document.getElementById('bgOverlay');
  const bgCtx = bgOverlay.getContext('2d');
  let on=false, segmenter=null, loading=false, loadFailed=false, rafId=null, lastVideoTime=-1;
  let color = '#ffffff';
  let bgImg=null, bgImgSrc=null;   // 배경 이미지(사진) 사용 시. 있으면 색 대신 이미지 사용.
  let maskCanvas=null, maskCtx=null, off=null;

  // 투명 배경 미리보기용 체커보드 패턴
  const checker = (()=>{ const c=document.createElement('canvas'); c.width=c.height=20;
    const x=c.getContext('2d'); x.fillStyle='#c9c9c9'; x.fillRect(0,0,20,20);
    x.fillStyle='#f2f2f2'; x.fillRect(0,0,10,10); x.fillRect(10,10,10,10);
    return bgCtx.createPattern(c,'repeat'); })();

  function getOff(w,h){ if(!off) off=document.createElement('canvas'); if(off.width!==w||off.height!==h){ off.width=w; off.height=h; } return off; }

  async function ensureModel(){
    if(segmenter || loadFailed) return segmenter;
    if(loading) return null;
    loading=true;
    try{
      const vision = await import(`${MP_BASE}/vision_bundle.mjs`);
      const { ImageSegmenter, FilesetResolver } = vision;
      const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
      const opts = (delegate)=>({ baseOptions:{ modelAssetPath:MODEL_URL, delegate }, runningMode:"VIDEO", outputCategoryMask:false, outputConfidenceMasks:true });
      try{ segmenter = await ImageSegmenter.createFromOptions(fileset, opts("GPU")); }
      catch(_){ segmenter = await ImageSegmenter.createFromOptions(fileset, opts("CPU")); }
    }catch(err){ loadFailed=true; console.warn('[배경] 모델 로드 실패', err); }
    finally{ loading=false; }
    return segmenter;
  }

  // 인물 확률(0~1) → 알파 마스크 캔버스 (인물=불투명)
  function buildMask(mask){
    const w=mask.width, h=mask.height, arr=mask.getAsFloat32Array();
    if(!maskCanvas){ maskCanvas=document.createElement('canvas'); maskCtx=maskCanvas.getContext('2d'); }
    if(maskCanvas.width!==w||maskCanvas.height!==h){ maskCanvas.width=w; maskCanvas.height=h; }
    const img=maskCtx.createImageData(w,h), d=img.data;
    for(let i=0;i<arr.length;i++){ const j=i*4; d[j]=d[j+1]=d[j+2]=0; d[j+3]=Math.round(arr[i]*255); }
    maskCtx.putImageData(img,0,0);
  }

  function sizeOverlay(){
    const r=stage.getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,3);
    const w=Math.round(r.width*dpr), h=Math.round(r.height*dpr);
    if(bgOverlay.width!==w||bgOverlay.height!==h){ bgOverlay.width=w; bgOverlay.height=h; }
    return {w,h};
  }
  // 배경 레이어 그리기. 이미지면 좌우반전을 상쇄해서 그림(오버레이/캡처가 mirror 로 다시 반전되므로 원본 방향 유지).
  function drawBgLayer(ctx, w, h){
    if(bgImg){
      ctx.save();
      if(mirror){ ctx.translate(w,0); ctx.scale(-1,1); }
      coverDraw(ctx, bgImg, bgImg.naturalWidth||bgImg.width, bgImg.naturalHeight||bgImg.height, w, h);
      ctx.restore();
    } else {
      ctx.fillStyle = (color==='transparent') ? checker : color;
      ctx.fillRect(0,0,w,h);
    }
  }
  function paintOverlay(w,h){
    bgCtx.setTransform(1,0,0,1,0,0);
    bgCtx.globalCompositeOperation='source-over';
    bgCtx.clearRect(0,0,w,h);
    drawBgLayer(bgCtx, w, h);
    if(maskCanvas){
      bgCtx.globalCompositeOperation='destination-out';
      coverDraw(bgCtx, maskCanvas, maskCanvas.width, maskCanvas.height, w, h);
      bgCtx.globalCompositeOperation='source-over';
    }
  }
  function repaint(){ if(!on) return; const {w,h}=sizeOverlay(); paintOverlay(w,h); }

  async function loop(){
    if(!on) return;
    rafId=requestAnimationFrame(loop);
    if(!segmenter) return;
    if(mode!=="camera"||!video.videoWidth) return;
    if(video.currentTime===lastVideoTime){ return; }
    lastVideoTime=video.currentTime;
    let res=null; try{ res=segmenter.segmentForVideo(video, performance.now()); }catch(e){ return; }
    if(res && res.confidenceMasks && res.confidenceMasks.length){
      buildMask(res.confidenceMasks[0]);
      res.confidenceMasks.forEach(m=>{ try{ m.close && m.close(); }catch(_){}} );
    }
    const {w,h}=sizeOverlay(); paintOverlay(w,h);
  }

  async function enable(){
    on=true; stage.classList.add('bg-on');
    await ensureModel();
    if(loadFailed){ on=false; stage.classList.remove('bg-on'); toast('배경 제거 모델을 불러오지 못했어요'); return; }
    lastVideoTime=-1; if(!rafId) loop();
  }
  function disable(){
    on=false; stage.classList.remove('bg-on');
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    bgCtx.setTransform(1,0,0,1,0,0); bgCtx.clearRect(0,0,bgOverlay.width,bgOverlay.height);
  }
  async function toggle(){ if(on) disable(); else await enable(); return on; }
  function setColor(c){ color=c; bgImg=null; bgImgSrc=null; repaint(); }
  function setImage(src){
    if(bgImgSrc===src && bgImg){ repaint(); return; }
    bgImgSrc=src;
    const img=new Image();
    img.onload=()=>{ if(bgImgSrc===src){ bgImg=img; repaint(); } };
    img.onerror=()=>{ if(bgImgSrc===src){ bgImg=null; toast('배경 이미지를 불러오지 못했어요'); } };
    img.src=src;
  }

  // 캡처: 배경(색/투명/이미지) 위에 인물만 잘라 합성. targetCtx 는 미러 블록 안.
  function captureBase(targetCtx, W, H){
    if(bgImg){
      targetCtx.save();
      if(mirror){ targetCtx.translate(W,0); targetCtx.scale(-1,1); }
      coverDraw(targetCtx, bgImg, bgImg.naturalWidth||bgImg.width, bgImg.naturalHeight||bgImg.height, W, H);
      targetCtx.restore();
    } else if(color!=='transparent'){ targetCtx.fillStyle=color; targetCtx.fillRect(0,0,W,H); }
    const o=getOff(W,H), octx=o.getContext('2d');
    octx.setTransform(1,0,0,1,0,0); octx.globalCompositeOperation='source-over'; octx.clearRect(0,0,W,H);
    coverDraw(octx, video, video.videoWidth, video.videoHeight, W, H);
    if(maskCanvas){
      octx.globalCompositeOperation='destination-in';
      coverDraw(octx, maskCanvas, maskCanvas.width, maskCanvas.height, W, H);
      octx.globalCompositeOperation='source-over';
    }
    targetCtx.drawImage(o, 0, 0);
  }

  return { get on(){ return on; }, get ready(){ return on && !!maskCanvas; }, get color(){ return color; }, setColor, setImage, toggle, captureBase };
})();

/* 배경 색 선택 바 */
const bgbar = document.getElementById('bgbar');
const bgColorInput = document.getElementById('bgColorInput');
function clearBgActive(){ [...bgbar.querySelectorAll('.sw')].forEach(s=>s.classList.remove('on')); }
[...bgbar.querySelectorAll('.sw[data-c]')].forEach(sw=>{
  sw.addEventListener('click', ()=>{ BG.setColor(sw.dataset.c); clearBgActive(); sw.classList.add('on'); });
});
[...bgbar.querySelectorAll('.sw[data-img]')].forEach(sw=>{
  sw.addEventListener('click', ()=>{ BG.setImage(sw.dataset.img); clearBgActive(); sw.classList.add('on'); });
});
bgColorInput.addEventListener('input', e=>{ BG.setColor(e.target.value); clearBgActive(); bgColorInput.closest('.sw').classList.add('on'); });
// 기본: 흰색 선택 표시
const _white=[...bgbar.querySelectorAll('.sw[data-c]')].find(s=>s.dataset.c==='#ffffff'); if(_white) _white.classList.add('on');

</script>
</body>
