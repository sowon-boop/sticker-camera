<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#FFE9AE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<title>소원 가챠 🎰</title>
<style>
  :root{
    /* 배경 : 차분한 라벤더 그레이 */
    --bg:#C9C4DE; --bg-hi:#F2F0F8; --bg-lo:#A9A2C8;
    --card:#fff;
    --ink:#544D66; --ink2:#7B7392; --muted:#A9A2BC; --line:#E9E6F2;
    /* 기계 몸통 : 아이보리 */
    --iv-hi:#FFFFFF; --iv:#FBF7EF; --iv-mid:#F2ECDF; --iv-lo:#CFC7B6; --iv-dd:#A79E8A;
    /* 포인트 : 더스티 핑크 */
    --pink:#F0A0B6; --pink-d:#D9748F; --pink-dd:#B85974;
    --mint:#8FE3C6; --gold:#F0B429;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0;}
  body{
    font-family:"Jua",system-ui,sans-serif; color:var(--ink);
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:18px; overflow:hidden; touch-action:none;
    background:
      radial-gradient(900px 640px at 50% 4%, var(--bg-hi) 0%, rgba(242,240,248,0) 60%),
      radial-gradient(760px 540px at 50% 110%, var(--bg-lo) 0%, rgba(169,162,200,0) 64%),
      var(--bg);
  }
  /* 바닥 그림자 → 기계가 바닥에 놓인 느낌 */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(120% 80% at 50% 45%, rgba(0,0,0,0) 55%, rgba(60,50,90,.22) 100%);
  }
  .wrap{width:100%; max-width:420px; text-align:center; position:relative; z-index:1;}
  h1{font-size:26px; color:#4A4360; margin-bottom:4px; text-shadow:0 2px 0 rgba(255,255,255,.75), 0 4px 10px rgba(60,50,90,.20);}
  .sub{color:#6E6689; font-size:14px; margin-bottom:22px;}

  /* ==========================================================
     가챠 기계 — 입체
     ========================================================== */
  .stage{position:relative; width:262px; margin:0 auto; padding-bottom:26px;}
  /* 기계가 드리우는 바닥 그림자 */
  .stage::after{
    content:""; position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
    width:210px; height:26px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(55,45,85,.42), rgba(55,45,85,0));
    filter:blur(1px);
  }
  .machine{position:relative; user-select:none; z-index:2;}
  .machine.shake{animation:shake .5s ease;}
  @keyframes shake{10%,90%{transform:translateX(-2px);}30%,50%,70%{transform:translateX(-5px) rotate(-1deg);}40%,60%{transform:translateX(5px) rotate(1deg);}}

  /* ---- 유리 돔 ---- */
  .dome{
    position:relative; height:184px; margin:0 12px;
    border-radius:132px 132px 20px 20px;
    background:
      radial-gradient(120% 90% at 30% 18%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.42) 26%, rgba(255,255,255,.10) 52%, rgba(255,255,255,0) 70%),
      radial-gradient(90% 70% at 78% 82%, rgba(200,190,235,.35), rgba(200,190,235,0) 70%),
      linear-gradient(180deg, rgba(255,255,255,.34), rgba(170,162,200,.22));
    border:none;
    box-shadow:
      inset 0 0 0 5px rgba(255,255,255,.95),          /* 유리 테두리 */
      inset 6px 0 18px -6px rgba(70,60,100,.28),      /* 좌측 곡률 음영 */
      inset -10px 0 22px -8px rgba(70,60,100,.32),    /* 우측 곡률 음영 */
      inset 0 -14px 22px -10px rgba(70,60,100,.28),   /* 하단 음영 */
      0 10px 22px rgba(60,50,90,.22);
    overflow:hidden;
  }
  /* 캡슐 뒤쪽 : 돔 안쪽 깊이감 (캡슐보다 아래에 깔림) */
  .dome::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:
      radial-gradient(70% 40% at 50% 104%, rgba(60,50,95,.40), rgba(60,50,95,0) 72%),
      radial-gradient(85% 70% at 50% 30%, rgba(70,60,100,.16), rgba(70,60,100,0) 70%);
  }
  /* 유리 표면 : 반사광 + 구면 음영 (캡슐보다 위에 덮임) */
  .dome::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:
      /* 큰 반사광 (왼쪽 위) */
      radial-gradient(38% 26% at 25% 15%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.42) 46%, rgba(255,255,255,0) 74%),
      /* 작은 스펙큘러 점 */
      radial-gradient(8% 5% at 63% 11%, rgba(255,255,255,.95), rgba(255,255,255,0) 72%),
      /* 오른쪽 아래 림 라이트 */
      radial-gradient(30% 34% at 88% 66%, rgba(255,255,255,.55), rgba(255,255,255,0) 72%),
      /* 바닥 반사광 */
      radial-gradient(58% 18% at 50% 95%, rgba(255,255,255,.45), rgba(255,255,255,0) 74%),
      /* 구면 : 가장자리로 갈수록 어둡게 */
      radial-gradient(76% 68% at 40% 36%, rgba(70,60,100,0) 56%, rgba(70,60,100,.22) 84%, rgba(70,60,100,.40) 100%);
    animation:shimmer 6s ease-in-out infinite;
  }
  @keyframes shimmer{0%,100%{opacity:1;}50%{opacity:.88;}}
  /* 유리 두께 : 흰 테두리 안쪽에 한 겹 더 */
  .glassedge{
    position:absolute; inset:5px; border-radius:127px 127px 16px 16px; pointer-events:none; z-index:6;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 14px rgba(70,60,100,.22);
  }
  /* 캡슐 (JS가 배경색만 인라인으로 넣음) */
  .caps{
    position:absolute; border-radius:50%;
    box-shadow:
      inset 0 -6px 10px rgba(0,0,0,.28),
      inset 0 4px 6px rgba(255,255,255,.55),
      0 3px 6px rgba(90,60,10,.28);
  }
  .caps::before{
    content:""; position:absolute; left:20%; top:14%; width:32%; height:26%;
    border-radius:50%; background:rgba(255,255,255,.9); filter:blur(1px);
  }
  /* 캡슐 아래쪽 그늘 → 서로 겹쳐 쌓인 느낌 */
  .caps::after{
    content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:radial-gradient(70% 60% at 38% 30%, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 46%),
               radial-gradient(90% 80% at 62% 82%, rgba(40,30,70,.34), rgba(40,30,70,0) 62%);
  }
  /* 깊이별 밝기 차이 */
  .caps:nth-child(3n){filter:brightness(.90) saturate(.95);}
  .caps:nth-child(4n){filter:brightness(1.05);}
  .caps:nth-child(5n){filter:brightness(.84) saturate(.9);}

  /* ---- 돔과 본체 사이 금속 링 ---- */
  .neck{
    height:16px; margin:-6px 4px 0; border-radius:6px;
    background:linear-gradient(90deg,#A79B7E 0%, #FFFFFF 16%, #EFE7D2 42%, #FFFFFF 58%, #C4B896 86%, #8F8467 100%);
    box-shadow:0 4px 8px rgba(120,80,10,.30), inset 0 -2px 3px rgba(0,0,0,.20), inset 0 2px 0 rgba(255,255,255,.9);
  }

  /* ---- 본체 ---- */
  .body{
    position:relative; margin:0 0 0; padding:18px 18px 16px; border-radius:16px;
    /* 좌우 어둡게 → 원통 느낌 */
    background:linear-gradient(90deg,
      var(--iv-dd) 0%, var(--iv-lo) 5%, var(--iv-hi) 20%, var(--iv) 46%,
      var(--iv-mid) 66%, var(--iv-lo) 86%, var(--iv-dd) 100%);
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,.85),
      inset 0 -10px 16px rgba(110,95,70,.28),
      0 14px 26px rgba(60,50,90,.30);
  }
  /* 본체 상단 광택 띠 */
  .body::before{
    content:""; position:absolute; left:14px; right:14px; top:6px; height:16px; border-radius:10px;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    pointer-events:none;
  }

  /* 동전 투입구 */
  .slot{
    width:74px; height:13px; margin:2px auto 14px; border-radius:7px;
    background:linear-gradient(180deg,#4A4459,#6E6683);
    box-shadow:inset 0 3px 5px rgba(0,0,0,.55), 0 1.5px 0 rgba(255,255,255,.8);
  }

  /* 손잡이 */
  .knobwrap{position:relative; width:86px; margin:0 auto;}
  .knob{
    width:70px; height:70px; border-radius:50%; margin:0 auto; position:relative;
    background:
      radial-gradient(circle at 34% 28%, #FFFFFF 0%, #FBF4E0 38%, #E4D8B8 68%, #B5A784 100%);
    box-shadow:
      0 6px 12px rgba(110,70,10,.42),
      inset 0 -5px 9px rgba(120,90,30,.35),
      inset 0 4px 6px rgba(255,255,255,.95);
    cursor:grab; touch-action:none;
  }
  .knob:active{cursor:grabbing;}
  /* 안쪽 원판 */
  .knob::before{
    content:""; position:absolute; inset:12px; border-radius:50%;
    background:radial-gradient(circle at 36% 30%, #FFC6D5 0%, var(--pink) 46%, var(--pink-dd) 100%);
    box-shadow:inset 0 -4px 8px rgba(120,45,70,.45), inset 0 3px 5px rgba(255,255,255,.6), 0 1px 2px rgba(0,0,0,.18);
  }
  /* 돌리는 막대 */
  .knob::after{
    content:""; position:absolute; left:50%; top:8px; width:9px; height:54px; border-radius:5px;
    transform:translateX(-50%);
    background:linear-gradient(90deg,#D9CFB4 0%, #FFFFFF 35%, #FFFFFF 55%, #C7BC9C 100%);
    box-shadow:0 2px 5px rgba(80,50,0,.45), inset 0 1px 0 rgba(255,255,255,.9);
  }
  @keyframes spinhint{to{transform:rotate(360deg);}}

  /* 배출구 */
  .chute{
    width:104px; height:48px; margin:16px auto 0; border-radius:11px; position:relative;
    background:linear-gradient(180deg,#2B2636 0%, #4B4459 55%, #35303F 100%);
    box-shadow:
      inset 0 9px 14px rgba(0,0,0,.72),
      inset 0 -3px 5px rgba(255,255,255,.10),
      0 2px 0 rgba(255,255,255,.65);
  }
  .chute .lip{
    position:absolute; left:0; right:0; bottom:0; height:14px; z-index:4; border-radius:0 0 9px 9px;
    background:linear-gradient(180deg,#3A3446,#221E2C);
    box-shadow:inset 0 3px 5px rgba(0,0,0,.5), 0 -1px 0 rgba(255,255,255,.10);
  }

  /* 받침대 */
  .base{
    height:20px; margin:0 -4px; border-radius:0 0 12px 12px;
    background:linear-gradient(90deg,#6E6683 0%, #8C849F 18%, #A79FB8 50%, #857D98 82%, #625A76 100%);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.35), inset 0 -6px 10px rgba(0,0,0,.30), 0 8px 16px rgba(60,50,90,.35);
  }

  /* ---- 캡슐 (배출) ---- */
  .capOut{
    /* z-index 는 배출구 입술(4)·받침대보다 위 — 안 그러면 캡슐 윗부분이 가려진다 */
    position:absolute; left:50%; top:4px; width:56px; height:56px; margin-left:-28px; z-index:9;
    transform:translateY(-78px); opacity:0; pointer-events:none;
  }
  .capOut.drop{animation:capdrop .7s cubic-bezier(.3,.8,.4,1.2) forwards;}
  /* 배출구 안에서는 안 보이다가 입구를 지나며 나타난다 */
  @keyframes capdrop{
    0%{transform:translateY(-10px) rotate(0); opacity:0;}
    30%{transform:translateY(18px) rotate(6deg); opacity:0;}
    50%{transform:translateY(64px) rotate(12deg); opacity:1;}
    75%{transform:translateY(108px) rotate(-8deg); opacity:1;}
    100%{transform:translateY(98px) rotate(0); opacity:1;}
  }
  /* 앞으로 크게 들어올려 한 번 보여준다 */
  .capOut.present{animation:cappresent .5s cubic-bezier(.2,1.5,.4,1) forwards;}
  @keyframes cappresent{
    0%{transform:translateY(98px) scale(1) rotate(0); opacity:1;}
    55%{transform:translateY(12px) scale(1.85) rotate(-6deg); opacity:1;}
    100%{transform:translateY(20px) scale(1.7) rotate(0); opacity:1;}
  }
  /* 누를 수 있는 상태 — 톡톡 부풀며 신호. 이때만 클릭을 받는다 */
  .capOut.present.tappable{animation:cappulse .6s ease-in-out infinite; pointer-events:auto; cursor:pointer;}
  @keyframes cappulse{
    0%,100%{transform:translate(-6px,20px) scale(1.7) rotate(-7deg); opacity:1;}
    50%{transform:translate(6px,20px) scale(1.7) rotate(7deg); opacity:1;}
  }
  /* 열리는 순간 부풀기를 멈추고 고정 */
  .capOut.present.open{animation:none; transform:translateY(20px) scale(1.7); opacity:1;}
  .half{position:absolute; left:0; width:56px; height:28px; transition:transform .45s cubic-bezier(.3,.9,.4,1.3);}
  .half.top{
    top:0; border-radius:28px 28px 0 0; overflow:hidden;
    box-shadow:inset 0 5px 7px rgba(255,255,255,.6), inset 0 -3px 6px rgba(0,0,0,.22), 0 3px 7px rgba(70,45,5,.45);
  }
  /* 캡슐 반사광 */
  .half.top::after{
    content:""; position:absolute; left:20%; top:22%; width:34%; height:38%;
    border-radius:50%; background:rgba(255,255,255,.9); filter:blur(1.5px);
  }
  .half.bot{
    bottom:0; border-radius:0 0 28px 28px;
    background:linear-gradient(180deg,#FFFFFF 0%, #F3EDDD 55%, #CFC5A9 100%);
    box-shadow:inset 0 -4px 7px rgba(0,0,0,.22), 0 4px 8px rgba(70,45,5,.4);
  }
  .capOut.open .half.top{transform:translateY(-42px) rotate(-24deg);}
  .capOut.open .half.bot{transform:translateY(30px) rotate(12deg);}}

  /* ==========================================================
     안내 / 도구
     ========================================================== */
  .hint{margin-top:78px; color:#5A5273; font-size:16px; font-weight:700; text-shadow:0 1.5px 0 rgba(255,255,255,.65);}
  .stock{margin-top:10px; font-size:14px; color:#6E6689; font-weight:700;}
  .tools{margin-top:12px; display:flex; gap:8px; justify-content:center;}
  .tools button{
    padding:8px 14px; border:none; border-radius:999px;
    background:linear-gradient(180deg,#FFFFFF,#F1EEF8); color:#7B7392;
    font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
    box-shadow:0 3px 0 #C9C3DC, 0 6px 12px rgba(60,50,90,.20), inset 0 1px 0 #fff;
    transition:transform .07s, box-shadow .07s;
  }
  .tools button:active{transform:translateY(3px); box-shadow:0 0 0 #C9C3DC, inset 0 2px 4px rgba(60,50,90,.28);}

  /* ==========================================================
     결과 카드
     ========================================================== */
  .result{position:fixed; inset:0; background:rgba(45,38,68,.58); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:24px; z-index:10; overflow:auto;}
  .result.show{display:flex;}
  .prizecard{
    background:linear-gradient(170deg,#FFFFFF 0%,#FDFBFF 55%,#F4F1FA 100%);
    border-radius:26px; padding:26px 22px; max-width:340px; width:100%; text-align:center;
    box-shadow:0 6px 0 rgba(90,80,130,.22), 0 26px 60px rgba(30,24,50,.40), inset 0 2px 0 #fff;
    transform:translateY(14px) scale(.96); opacity:0; animation:rise .4s ease forwards;
  }
  @keyframes rise{to{transform:translateY(0) scale(1); opacity:1;}}
  .prizecard .big{font-size:64px; line-height:1; filter:drop-shadow(0 6px 8px rgba(70,58,110,.32));}
  .prizecard .pname{font-size:24px; color:var(--pink-d); margin:10px 0 4px; text-shadow:0 1.5px 0 rgba(255,255,255,.9);}
  .prizecard .pdesc{color:var(--muted); font-size:15px; line-height:1.5;}
  .photo{width:150px; height:190px; object-fit:cover; border-radius:14px; margin:6px auto; display:block;
    border:4px solid var(--pink); background:#F4F1FA; box-shadow:0 8px 16px rgba(60,50,90,.3);}
  .photo-ph{width:150px; height:190px; border-radius:14px; margin:6px auto; display:flex; align-items:center; justify-content:center;
    background:#F7F5FC; border:4px dashed var(--pink); color:var(--muted); font-size:13px; text-align:center; padding:10px;
    box-shadow:inset 0 3px 8px rgba(80,68,120,.16);}
  .again{
    margin-top:18px; width:100%; padding:15px; border:none; border-radius:16px;
    font-family:inherit; font-size:16px; font-weight:800; color:#fff; cursor:pointer;
    background:linear-gradient(180deg,#FFB9CA,var(--pink) 45%,var(--pink-d) 100%);
    box-shadow:0 5px 0 var(--pink-dd), 0 12px 22px rgba(180,80,110,.30), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .07s, box-shadow .07s;
  }
  .again:active{transform:translateY(5px); box-shadow:0 0 0 var(--pink-dd), inset 0 3px 6px rgba(120,40,65,.4);}
  .close{
    margin-top:10px; width:100%; padding:13px; border:none; border-radius:16px;
    font-family:inherit; font-size:14px; font-weight:700; color:#7B7392; cursor:pointer;
    background:linear-gradient(180deg,#FFFFFF,#F1EEF8);
    box-shadow:0 4px 0 #CFC9E0, inset 0 1px 0 #fff;
  }
  .close:active{transform:translateY(4px); box-shadow:none;}
  .leftnote{margin-top:10px; font-size:13px; color:var(--muted);}
  .logrow{display:flex; align-items:center; gap:9px; padding:10px 11px; font-size:14.5px; text-align:left;
    background:linear-gradient(180deg,#fff,#F7F5FC); border-radius:10px; margin-bottom:6px;
    box-shadow:0 2px 0 rgba(160,150,195,.35), inset 0 1px 0 #fff;}
  .logrow .lp{flex:1; color:var(--ink);}
  .logrow .lw{color:var(--pink-d); font-size:13px;}
  .logempty{color:var(--muted); font-size:14px; padding:14px 0;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎰 소원 가챠</h1>
    <div class="sub">손잡이를 <b>돌려봐</b></div>

    <div class="stage">
      <div class="machine" id="machine">
        <div class="dome" id="dome"><span class="glassedge"></span></div>
        <div class="neck"></div>
        <div class="body">
          <div class="slot"></div>
          <div class="knobwrap"><div class="knob" id="knob"></div></div>
          <div class="chute">
            <div class="capOut" id="capOut">
              <div class="half top" id="capTop"></div>
              <div class="half bot"></div>
            </div>
            <div class="lip"></div>
          </div>
        </div>
        <div class="base"></div>
      </div>
    </div>

    <div class="hint" id="hint">👆 손잡이를 빙글 돌려봐!</div>
    <div class="stock" id="stock"></div>
    <div class="tools"><button id="logBtn">📋 뽑힌 기록</button><button id="resetBtn">🔄 초기화</button></div>
  </div>

  <div class="result" id="logView"><div class="prizecard" id="logCard"></div></div>
  <div class="result" id="result"><div class="prizecard" id="prizecard"></div></div>

<script>
/* ===== 가챠 상품 — qty 만큼 캡슐이 들어있고, 뽑히면 그만큼 줄어든다
       (id 는 저장용이라 바꾸지 말 것 / 총 캡슐 = qty 합계) ===== */
const PRIZES = [
  { id:"haidilao10", emoji:"🌶️", name:"하이디라오 식사 지원 쿠폰",  desc:"오늘 하이디라오 1만원 대신 내준다", qty:1 },
  { id:"haidilao5",  emoji:"🌶️", name:"하이디라오 식사 지원 쿠폰",  desc:"오늘 하이디라오 5천원 대신 내준다", qty:1 },
  { id:"jelly",      emoji:"🍬", name:"젤리",                   desc:"달달한 젤리 한 봉지!", qty:2 },
  { id:"choco",      emoji:"🍫", name:"초콜릿",                  desc:"달콤한 초콜릿!", qty:1 },
  { id:"letter",     emoji:"📝", name:"소원이의 손편지",           desc:"직접 써서 보내줌", qty:1 },
  { id:"candy",      emoji:"🍭", name:"사탕",                    desc:"입이 심심할 때 먹자!", qty:1 },
  { id:"miss",       emoji:"😜", name:"꽝!",                     desc:"다음 생에 만나요…", qty:2 },
];
const TOTAL_CAPSULES = PRIZES.reduce((s,p)=>s+(p.qty||1), 0);
/* ===== 재고 — 이 기기에 저장. 수량만큼만 나오고 소진되면 사라진다 ===== */
const STORE_KEY='sowon_gacha_taken_v2';
function takenLog(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); }catch(e){ return []; } }
function saveLog(a){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(a)); }catch(e){} }
function takenCount(id){ return takenLog().filter(x=>x.id===id).length; }
/* 남은 캡슐을 낱개로 펼친다 — 젤리 2개면 젤리가 두 번 들어가서 그만큼 잘 나온다 */
function remaining(){
  const out=[];
  PRIZES.forEach(p=>{ const left=(p.qty||1)-takenCount(p.id); for(let i=0;i<left;i++) out.push(p); });
  return out;
}
function recordDraw(p){ const a=takenLog(); a.push({ id:p.id, name:p.name, who:'', ts:Date.now() }); saveLog(a); }

const CAP_COLORS=["#FF9CB4","#FFCF45","#8FE3C6","#9AD0FF","#C6BBF3","#FFB03A"];
/* 캡슐 쌓기 — 위에서 하나씩 떨어뜨려 쌓는다 (줄 맞춤 없음)
   1) 무작위 x 에서 낙하  2) 바닥/다른 캡슐에 닿으면 멈춤
   3) 하나 위에 걸쳐 있으면 낮은 쪽으로 굴러 내려가 홈에 자리잡음  */
try{ (function fillDome(){
  const dome=document.getElementById('dome');
  const W=238, WALL=8, MAX_TOP=140, COUNT=13;
  const placed=[];

  /* 이 x, 반지름 r 로 떨어뜨렸을 때 멈추는 높이(중심 y)와 받쳐주는 캡슐 */
  function drop(x,r){
    let y=r, on=[];                        // 기본은 바닥에 착지
    for(const p of placed){
      const dx=Math.abs(x-p.x), R=r+p.r;
      if(dx < R-0.02){
        const yy=p.y+Math.sqrt(R*R-dx*dx);
        if(yy > y+0.02){ y=yy; on=[p]; }
        else if(Math.abs(yy-y) <= 0.02){ on.push(p); }
      }
    }
    return { y, on };
  }

  let guard=0;
  while(placed.length<COUNT && guard++<3000){
    const r=22+Math.random()*4;
    let x=WALL+r+Math.random()*(W-2*(WALL+r));
    let s=drop(x,r);

    /* 한 개 위에 얹혀 있으면 → 경사면을 따라 굴러 떨어짐 */
    for(let it=0; it<80; it++){
      if(s.on.length!==1) break;                  // 바닥이거나 두 개가 받치면 안정
      const dx=x-s.on[0].x;
      if(Math.abs(dx)<1.2) break;                 // 꼭대기에 정확히 얹힘
      const nx=Math.min(W-WALL-r, Math.max(WALL+r, x+Math.sign(dx)*1.5));
      if(nx===x) break;                           // 벽에 막힘
      const ns=drop(nx,r);
      if(ns.y <= s.y+0.02){ x=nx; s=ns; } else break;
    }

    if(s.y+r > MAX_TOP) continue;                 // 너무 높이 쌓이면 버림
    placed.push({ x, y:s.y, r });
  }

  /* 낮은 것부터 그려서 위 캡슐이 아래 캡슐을 덮게 */
  placed.sort((a,b)=>a.y-b.y).forEach(p=>{
    const cap=document.createElement('span');
    cap.className='caps';
    cap.style.width=cap.style.height=(p.r*2).toFixed(1)+'px';
    cap.style.left=p.x.toFixed(1)+'px';
    cap.style.bottom=(p.y-p.r).toFixed(1)+'px';
    cap.style.transform='translateX(-50%)';
    const t=(Math.random()*CAP_COLORS.length)|0;
    let b=(Math.random()*CAP_COLORS.length)|0; if(b===t) b=(t+1)%CAP_COLORS.length;   // 위아래 다른 색
    cap.style.background='linear-gradient(180deg,'+CAP_COLORS[t]+' 0 48%,'
      +'rgba(0,0,0,.22) 48% 52%,'+CAP_COLORS[b]+' 52% 100%)';
    dome.appendChild(cap);
  });
})(); }catch(e){ console.warn('돔 장식 실패(무시 가능):', e); }

/* 뒤쪽에서 무슨 일이 생겨도 재고 숫자는 먼저 띄운다 */
try{ const _el=document.getElementById('stock');
  if(_el) _el.textContent=`🎁 남은 캡슐 ${remaining().length} / ${TOTAL_CAPSULES}개`; }catch(e){}

/* ===== 사운드 ===== */
let actx=null;
function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function tick(){ const a=AC(); if(!a) return; const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type='square'; o.frequency.value=780+Math.random()*220; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.12,t+0.004); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.06); }
function ding(){ const a=AC(); if(!a) return; const t=a.currentTime;
  [[880,0],[1174,0.09],[1568,0.18]].forEach(([f,dt])=>{ const o=a.createOscillator(),g=a.createGain();
    o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(0.16,t+dt+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.4);
    o.connect(g); g.connect(a.destination); o.start(t+dt); o.stop(t+dt+0.45); }); }
function crack(){ const a=AC(); if(!a) return; const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type='square'; o.frequency.setValueAtTime(500,t); o.frequency.exponentialRampToValueAtTime(120,t+0.12);
  g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.18); }

/* ===== 손잡이 돌리기(드래그) ===== */
const machine=document.getElementById('machine'), knob=document.getElementById('knob');
const capOut=document.getElementById('capOut'), hint=document.getElementById('hint');
let busy=false, dragging=false, lastAng=0, turned=0, baseRot=0, tickAcc=0;
let pending=null;   // 나와 있지만 아직 안 연 캡슐의 상품
const THRESHOLD=300; // 이만큼 돌리면 뽑기
function angAt(e){ const r=knob.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI; }
knob.addEventListener('pointerdown', e=>{ if(busy) return; dragging=true; turned=0; tickAcc=0; lastAng=angAt(e); AC(); e.preventDefault(); });
window.addEventListener('pointermove', e=>{ if(!dragging||busy) return;
  const a=angAt(e); let d=a-lastAng; if(d>180)d-=360; if(d<-180)d+=360; turned+=d; lastAng=a;
  baseRot+=d; knob.style.transform=`rotate(${baseRot}deg)`;
  tickAcc+=Math.abs(d); if(tickAcc>=38){ tickAcc=0; tick(); }
  if(Math.abs(turned)>=THRESHOLD){ dragging=false; dispense(); }
}, {passive:false});
function endDrag(){ if(dragging && !busy){ dragging=false; if(Math.abs(turned)<THRESHOLD){ hint.textContent='조금 더 돌려봐! 🔄'; } } }
window.addEventListener('pointerup', endDrag); window.addEventListener('pointercancel', endDrag);

function pickPrize(){ const r=remaining(); return r[(Math.random()*r.length)|0]; }
function dispense(){
  if(busy) return;
  if(!remaining().length){ soldOut(); return; }
  busy=true; machine.classList.add('busy'); hint.textContent='두구두구… 🥁';
  machine.classList.remove('shake'); void machine.offsetWidth; machine.classList.add('shake');
  const prize=pickPrize(), col=CAP_COLORS[(Math.random()*CAP_COLORS.length)|0];
  // 재고는 캡슐을 '열었을 때' 깎는다 — 안 열고 나가면 상품이 증발하기 때문
  document.getElementById('capTop').style.background=col;
  capOut.classList.remove('open','present','tappable');
  capOut.style.transform=''; capOut.style.opacity='';
  pending = prize;                       // 사용자가 누를 때까지 들고 있는다
  capOut.classList.remove('drop'); void capOut.offsetWidth; capOut.classList.add('drop');
  setTimeout(()=>{ capOut.classList.remove('drop'); capOut.classList.add('present'); hint.textContent='캡슐이 나왔다! 🥚'; }, 700);
  setTimeout(()=>{ capOut.classList.add('tappable'); hint.textContent='👆 캡슐을 눌러서 열어봐!'; }, 700+500);
}
/* 캡슐을 눌렀을 때만 열린다 */
function openCapsule(){
  if(!capOut.classList.contains('tappable') || !pending) return;
  capOut.classList.remove('tappable');
  crack(); capOut.classList.add('open'); hint.textContent='짠! 🎉';
  const p=pending; pending=null;
  recordDraw(p); updateStockUI();
  setTimeout(()=>{ ding(); showResult(p); }, 520);
}
capOut.addEventListener('click', openCapsule);
function showResult(p){
  const card=document.getElementById('prizecard');
  const photo = p.photo ? `<img class="photo" src="${p.photo}" alt="소원" onerror="this.outerHTML='<div class=\\'photo-ph\\'>여기에 소원 사진이 들어갈 예정 📸</div>'">` : '';
  const left = remaining().length;
  card.innerHTML = `<div class="big">${p.emoji}</div>${photo}<div class="pname">${p.name}</div><div class="pdesc">${p.desc}</div>
    <button class="again" id="nextBtn">다시하기 🔄</button>
    <div class="leftnote">남은 캡슐 ${left}개</div>`;
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  document.getElementById('result').classList.add('show');
  document.getElementById('nextBtn').onclick=reset;
}
function reset(){ document.getElementById('result').classList.remove('show');
  capOut.classList.remove('drop','open','present','tappable'); capOut.style.transform=''; capOut.style.opacity='0';
  pending=null;
  busy=false; machine.classList.remove('busy'); turned=0;
  updateStockUI();
  if(!remaining().length) soldOut(); else hint.textContent='👆 손잡이를 빙글 돌려봐!';
}
function soldOut(){
  machine.classList.add('busy');
  hint.textContent='🎉 상품 다 나갔어! 수고했어 소원아';
  updateStockUI();
}
function updateStockUI(){
  const left=remaining().length;
  const el=document.getElementById('stock');
  if(el) el.textContent = left ? `🎁 남은 캡슐 ${left} / ${TOTAL_CAPSULES}개` : '🎁 캡슐 모두 소진';
}
/* ===== 뽑힌 기록 / 초기화 ===== */
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
document.getElementById('logBtn').onclick=()=>{
  const log=takenLog();
  const rows = log.length
    ? log.map((e,i)=>`<div class="logrow"><span class="lw">${i+1}</span><span class="lp">${esc(e.name)}</span></div>`).join('')
    : `<div class="logempty">아직 아무도 안 뽑았어</div>`;
  document.getElementById('logCard').innerHTML =
    `<div class="pname" style="margin-top:0">📋 뽑힌 기록</div>
     <div class="pdesc" style="margin-bottom:12px">${log.length}개 나감 · 남은 ${remaining().length}개</div>
     ${rows}<button class="close" id="logClose" style="margin-top:16px">닫기</button>`;
  document.getElementById('logView').classList.add('show');
  document.getElementById('logClose').onclick=()=> document.getElementById('logView').classList.remove('show');
};
document.getElementById('resetBtn').onclick=()=>{
  if(!confirm(`뽑힌 기록을 전부 지우고 캡슐 ${TOTAL_CAPSULES}개를 다시 채울까?`)) return;
  saveLog([]); reset(); machine.classList.remove('busy');
  hint.textContent='👆 손잡이를 빙글 돌려봐!'; updateStockUI();
};
/* 시작 상태 */
updateStockUI();
if(!remaining().length) soldOut();
</script>
</body>
</html>
