<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<title>소원 역조공 가챠 🎰</title>
<style>
  :root{ --bg:#FFF3CC; --card:#fff; --ink:#7A6533; --muted:#C7B888; --line:#F4ECD6;
    --yellow:#FFCF45; --yellow2:#FFB03A; --pink:#FF9CB4; --mint:#8FE3C6; --gold:#F0B429; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0;}
  body{font-family:"Jua",system-ui,sans-serif; background:var(--bg); color:var(--ink);
    min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:18px; overflow:hidden; touch-action:none;}
  .wrap{width:100%; max-width:420px; text-align:center;}
  h1{font-size:26px; color:#6b5220; margin-bottom:4px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:18px;}

  .machine{width:236px; margin:0 auto; position:relative; user-select:none;}
  .machine.shake{animation:shake .5s ease;}
  @keyframes shake{10%,90%{transform:translateX(-2px);}30%,50%,70%{transform:translateX(-5px) rotate(-1deg);}40%,60%{transform:translateX(5px) rotate(1deg);}}
  .dome{position:relative; height:168px; border-radius:120px 120px 22px 22px;
    background:radial-gradient(circle at 40% 30%, rgba(255,255,255,.9), rgba(255,255,255,.35) 45%, rgba(255,255,255,.12) 70%);
    border:5px solid #fff; box-shadow:inset 0 -8px 18px rgba(0,0,0,.06), 0 8px 16px rgba(240,180,41,.25); overflow:hidden;}
  .caps{position:absolute; border-radius:50%;}
  .body{background:var(--yellow); border-radius:14px; margin-top:-10px; padding:16px 16px 14px; border:5px solid #fff;
    box-shadow:0 10px 22px rgba(240,180,41,.35); position:relative;}
  .slot{width:70px; height:12px; background:#8a6a1e; border-radius:6px; margin:2px auto 12px;}
  .knobwrap{position:relative; width:78px; margin:0 auto;}
  .knob{width:66px; height:66px; border-radius:50%; margin:0 auto; background:#fff; border:5px solid #ffe6a8;
    position:relative; box-shadow:0 4px 10px rgba(0,0,0,.12); cursor:grab; touch-action:none;}
  .knob:active{cursor:grabbing;}
  .knob::before{content:""; position:absolute; inset:13px; border-radius:50%; background:var(--yellow2);}
  .knob::after{content:""; position:absolute; left:50%; top:7px; width:7px; height:24px; background:#fff; border-radius:4px; transform:translateX(-50%);}
  .turnhint{position:absolute; inset:-10px; border-radius:50%; border:3px dashed rgba(240,180,41,.55);
    animation:spinhint 3s linear infinite; pointer-events:none;}
  @keyframes spinhint{to{transform:rotate(360deg);}}
  .machine.busy .turnhint{display:none;}
  .chute{width:96px; height:44px; margin:14px auto 0; background:#7a5c16; border-radius:10px;
    box-shadow:inset 0 6px 10px rgba(0,0,0,.45); position:relative; overflow:hidden;}
  .chute .lip{position:absolute; left:0; right:0; bottom:0; height:12px; background:#5f4711; border-radius:0 0 8px 8px; z-index:4;}

  /* 캡슐 (두 반쪽) */
  .capOut{position:absolute; left:50%; top:4px; width:54px; height:54px; margin-left:-27px; z-index:3;
    transform:translateY(-78px); opacity:0;}
  .capOut.drop{animation:capdrop 1s cubic-bezier(.3,.8,.4,1.2) forwards;}
  @keyframes capdrop{0%{transform:translateY(-80px) rotate(0); opacity:0;}25%{opacity:1;}
    62%{transform:translateY(66px) rotate(14deg);}80%{transform:translateY(52px) rotate(-8deg);}100%{transform:translateY(60px) rotate(0);}}
  .capOut.wobble{animation:capwob .32s ease-in-out infinite;}
  @keyframes capwob{0%,100%{transform:translateY(60px) rotate(-9deg);}50%{transform:translateY(56px) rotate(9deg);}}
  .half{position:absolute; left:0; width:54px; height:27px; transition:transform .45s cubic-bezier(.3,.9,.4,1.3);}
  .half.top{top:0; border-radius:27px 27px 0 0;}
  .half.bot{bottom:0; border-radius:0 0 27px 27px; background:#fff; box-shadow:inset 0 -3px 6px rgba(0,0,0,.12);}
  .capOut.open .half.top{transform:translateY(-40px) rotate(-24deg);}
  .capOut.open .half.bot{transform:translateY(30px) rotate(12deg);}
  .capPrize{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.2); font-size:34px; opacity:0; z-index:5;}
  .capOut.open .capPrize{animation:prizepop .5s .12s cubic-bezier(.2,1.5,.4,1) forwards;}
  @keyframes prizepop{to{opacity:1; transform:translate(-50%,-90%) scale(1);}}

  .hint{margin-top:74px; color:#9a8235; font-size:15.5px; font-weight:700;}

  .result{position:fixed; inset:0; background:rgba(60,45,20,.55); display:none; align-items:center; justify-content:center; padding:24px; z-index:10;}
  .result.show{display:flex;}
  .prizecard{background:var(--card); border-radius:24px; padding:26px 22px; max-width:340px; width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.3); text-align:center; transform:translateY(14px) scale(.96); opacity:0; animation:rise .4s ease forwards;}
  @keyframes rise{to{transform:translateY(0) scale(1); opacity:1;}}
  .prizecard .big{font-size:64px; line-height:1;}
  .prizecard .pname{font-size:24px; color:#e07a97; margin:10px 0 4px;}
  .prizecard .pdesc{color:var(--muted); font-size:15px; line-height:1.5;}
  .photo{width:150px; height:190px; object-fit:cover; border-radius:14px; margin:6px auto; display:block; border:4px solid var(--yellow); background:#FFF3CC;}
  .photo-ph{width:150px; height:190px; border-radius:14px; margin:6px auto; display:flex; align-items:center; justify-content:center;
    background:#FFF3CC; border:4px dashed var(--gold); color:var(--muted); font-size:13px; text-align:center; padding:10px;}
  .again{margin-top:18px; width:100%; padding:14px; border:none; border-radius:16px; font-family:inherit; font-size:16px; font-weight:800; color:#7a5618; background:var(--yellow); cursor:pointer;}
  .close{margin-top:8px; width:100%; padding:12px; border:2px solid var(--line); border-radius:16px; font-family:inherit; font-size:14px; font-weight:700; color:#8a7635; background:#FFF6DE; cursor:pointer;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎰 소원 역조공 가챠</h1>
    <div class="sub">손잡이를 <b>돌리면</b> 소원이가 쏜다!</div>

    <div class="machine" id="machine">
      <div class="dome" id="dome"></div>
      <div class="body">
        <div class="slot"></div>
        <div class="knobwrap"><div class="turnhint"></div><div class="knob" id="knob"></div></div>
        <div class="chute">
          <div class="capOut" id="capOut"><div class="half top" id="capTop"></div><div class="half bot"></div><div class="capPrize" id="capPrize"></div></div>
          <div class="lip"></div>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">👆 손잡이를 빙글 돌려봐!</div>
  </div>

  <div class="result" id="result"><div class="prizecard" id="prizecard"></div></div>

<script>
/* ===== 가챠 상품 (자유 수정) — weight 클수록 잘 나옴 ===== */
const PRIZES = [
  { emoji:"📸", name:"소원 포토카드", desc:"소원이 실물 사진 획득! 💖", photo:"images/sowon.jpg", weight:2 },
  { emoji:"☕", name:"커피 쿠폰", desc:"소원이가 커피 한 잔 쏜다!", weight:3 },
  { emoji:"🛵", name:"배달의민족 쿠폰", desc:"소원이가 배달 쏜다!", weight:2 },
  { emoji:"🍫", name:"간식 하나", desc:"원하는 간식 하나 골라!", weight:3 },
  { emoji:"🫶", name:"소원이랑 투샷", desc:"소원이랑 투샷 찍을 권리!", weight:3 },
  { emoji:"😜", name:"꽝!", desc:"다음 기회에… 한 번 더 돌려!", weight:2 },
];
const CAP_COLORS=["#FF9CB4","#FFCF45","#8FE3C6","#9AD0FF","#C6BBF3","#FFB03A"];
(function fillDome(){ const dome=document.getElementById('dome');
  for(let i=0;i<14;i++){ const c=document.createElement('span'); c.className='caps';
    const s=26+Math.random()*16; c.style.width=c.style.height=s+'px';
    c.style.left=(8+Math.random()*78)+'%'; c.style.top=(28+Math.random()*62)+'%';
    c.style.background=CAP_COLORS[i%CAP_COLORS.length]; c.style.opacity=.9; dome.appendChild(c); } })();

/* ===== 사운드 ===== */
let actx=null;
function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function tick(){ const a=AC(); if(!a) return; const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type='square'; o.frequency.value=780+Math.random()*220; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.12,t+0.004); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.06); }
function ding(){ const a=AC(); if(!a) return; const t=a.currentTime;
  [[880,0],[1174,0.09],[1568,0.18]].forEach(([f,dt])=>{ const o=a.createOscillator(),g=a.createGain();
    o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(0.16,t+dt+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.4);
    o.connect(g); g.connect(a.destination); o.start(t+dt); o.stop(t+dt+0.45); }); }
function crack(){ const a=AC(); if(!a) return; const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type='square'; o.frequency.setValueAtTime(500,t); o.frequency.exponentialRampToValueAtTime(120,t+0.12);
  g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.18); }

/* ===== 손잡이 돌리기(드래그) ===== */
const machine=document.getElementById('machine'), knob=document.getElementById('knob');
const capOut=document.getElementById('capOut'), capPrize=document.getElementById('capPrize'), hint=document.getElementById('hint');
let busy=false, dragging=false, lastAng=0, turned=0, baseRot=0, tickAcc=0;
const THRESHOLD=300; // 이만큼 돌리면 뽑기
function angAt(e){ const r=knob.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI; }
knob.addEventListener('pointerdown', e=>{ if(busy) return; dragging=true; turned=0; tickAcc=0; lastAng=angAt(e); AC(); e.preventDefault(); });
// 이동/떼기는 window 에서 감지 → 손가락이 손잡이 밖으로 나가도 계속 따라 돎
window.addEventListener('pointermove', e=>{ if(!dragging||busy) return;
  const a=angAt(e); let d=a-lastAng; if(d>180)d-=360; if(d<-180)d+=360; turned+=d; lastAng=a;
  baseRot+=d; knob.style.transform=`rotate(${baseRot}deg)`;
  tickAcc+=Math.abs(d); if(tickAcc>=38){ tickAcc=0; tick(); }
  if(Math.abs(turned)>=THRESHOLD){ dragging=false; dispense(); }
}, {passive:false});
function endDrag(){ if(dragging && !busy){ dragging=false; if(Math.abs(turned)<THRESHOLD){ hint.textContent='조금 더 돌려봐! 🔄'; } } }
window.addEventListener('pointerup', endDrag); window.addEventListener('pointercancel', endDrag);

function pickPrize(){ const total=PRIZES.reduce((s,p)=>s+(p.weight||1),0); let r=Math.random()*total;
  for(const p of PRIZES){ r-=(p.weight||1); if(r<=0) return p; } return PRIZES[PRIZES.length-1]; }
function dispense(){
  if(busy) return; busy=true; machine.classList.add('busy'); hint.textContent='두구두구… 🥁';
  machine.classList.remove('shake'); void machine.offsetWidth; machine.classList.add('shake');
  const prize=pickPrize(), col=CAP_COLORS[(Math.random()*CAP_COLORS.length)|0];
  document.getElementById('capTop').style.background=col;
  capOut.classList.remove('open','wobble'); capPrize.textContent=prize.emoji; capOut.style.transform=''; capOut.style.opacity='';
  // 1) 캡슐 배출
  capOut.classList.remove('drop'); void capOut.offsetWidth; capOut.classList.add('drop');
  // 2) 두구두구 흔들림(긴장감)
  setTimeout(()=>{ capOut.classList.remove('drop'); capOut.style.transform='translateY(60px)'; capOut.style.opacity='1'; capOut.classList.add('wobble'); hint.textContent='두구두구… 🥁'; }, 1000);
  // 3) 뚜껑 열림
  setTimeout(()=>{ capOut.classList.remove('wobble'); capOut.style.transform='translateY(60px)'; crack(); capOut.classList.add('open'); hint.textContent='짠! 🎉'; }, 1000+1200);
  // 4) 상품 카드
  setTimeout(()=>{ ding(); showResult(prize); }, 1000+1200+650);
}
function showResult(p){
  const card=document.getElementById('prizecard');
  const photo = p.photo ? `<img class="photo" src="${p.photo}" alt="소원" onerror="this.outerHTML='<div class=\\'photo-ph\\'>여기에 소원 사진이 들어갈 예정 📸</div>'">` : '';
  card.innerHTML = `<div class="big">${p.emoji}</div>${photo}<div class="pname">${p.name}</div><div class="pdesc">${p.desc}</div>
    <button class="again" id="againBtn">🎲 한 번 더</button><button class="close" id="closeBtn">닫기</button>`;
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  document.getElementById('result').classList.add('show');
  document.getElementById('againBtn').onclick=reset;
  document.getElementById('closeBtn').onclick=()=>{ document.getElementById('result').classList.remove('show'); reset(); };
}
function reset(){ document.getElementById('result').classList.remove('show');
  capOut.classList.remove('drop','open','wobble'); capOut.style.transform=''; capOut.style.opacity='0';
  busy=false; machine.classList.remove('busy'); turned=0; hint.textContent='👆 손잡이를 빙글 돌려봐!'; }
</script>
</body>
</html>
